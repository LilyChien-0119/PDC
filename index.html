<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>過負荷評估問卷（員工自填）</title>
<style>
:root {
  --bg: #f4f6f8; --panel: #ffffff; --ink: #1d2733; --muted: #5d6b7a; --line: #dfe5eb; --grid: #edf1f4;
  --brand: #1f4e78; --brand-ink: #ffffff; --focus: #2f7dd1;
  --l1: #2e7d4f; --l1-bg: #e3f3e9; --l2: #8a6d00; --l2-bg: #fff4c7; --nb: #6a4c9c; --nb-bg: #efe9f8;
  --l3: #b45309; --l3-bg: #fde3cf; --l4: #b42318; --l4-bg: #fde0de;
  --dot1: #3f9e64; --dot2: #d4a400; --dot3: #e07b1a; --dot4: #d03a2c; --dot0: #8a97a5;
  --now-bg: #e9f1f9;
  --radius: 10px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12171d; --panel: #1b222b; --ink: #e6ebf0; --muted: #9aa8b6; --line: #2c3643; --grid: #232c37;
    --brand: #5b9bd5; --brand-ink: #0d1620; --focus: #7db4ea;
    --l1: #7fd1a0; --l1-bg: #173326; --l2: #f0d26a; --l2-bg: #3a3214; --nb: #c3a8f0; --nb-bg: #2a2140;
    --l3: #f5a96b; --l3-bg: #3d2614; --l4: #ff8a80; --l4-bg: #42191a;
    --dot1: #6cc791; --dot2: #e8c547; --dot3: #f29a52; --dot4: #ff7a6e; --dot0: #8796a6;
    --now-bg: #1e2b3a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Heiti TC", system-ui, sans-serif;
  font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%;
}
.pr { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
.pr a { color: var(--brand); }
.pr h1 { font-size: 26px; line-height: 1.3; margin: 0; font-weight: 700; letter-spacing: .02em; }
.pr h2 { font-size: 18px; margin: 0 0 12px; font-weight: 700; }
.pr h3 { font-size: 15px; margin: 0; font-weight: 700; }
.pr .muted { color: var(--muted); }
.pr .num { font-variant-numeric: tabular-nums; }

/* 標頭 */
.pr-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px;
  padding-bottom: 16px; border-bottom: 2px solid var(--ink); margin-bottom: 8px; }
.pr-head .id { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 8px; letter-spacing: .04em; }
.pr-head .meta { margin: 6px 0 0; color: var(--muted); }
.pr-head .meta span { white-space: nowrap; }
.pr-head .meta span + span::before { content: "·"; margin: 0 8px; color: var(--muted); }
.pr-head .latest { text-align: right; }
.pr-head .latest .badge { font-size: 15px; padding: 4px 12px; }
.pr-head .latest .when { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
.pr-toc { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 10px 0 4px; font-size: 14px; }
.pr-toc a { color: var(--muted); text-decoration: none; }
.pr-toc a:hover { color: var(--brand); text-decoration: underline; }
.pr-toc .n { font-size: 12px; margin-left: 2px; }

.pr section { margin-top: 28px; }
.pr details.sec > summary { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; cursor: pointer; list-style: none; width: fit-content; color: inherit; }
.pr details.sec > summary::-webkit-details-marker { display: none; }
.pr details.sec > summary::before { content: ""; flex: none; border-style: solid; border-width: 6px 0 6px 10px;
  border-color: transparent transparent transparent currentColor; transition: transform .15s; }
.pr details.sec[open] > summary::before { transform: rotate(90deg); }
.pr details.sec > summary h2 { margin: 0; }
.pr details.sec:not([open]) > summary { margin-bottom: 0; }
.pr details.sec > summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
.pr .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.pr .hint { font-size: 13px; color: var(--muted); margin: -6px 0 12px; }
.pr .empty { color: var(--muted); font-size: 14px; background: var(--panel); border: 1px dashed var(--line);
  border-radius: var(--radius); padding: 14px 16px; }

/* 等級 */
.badge { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: 13px; font-weight: 700;
  white-space: nowrap; border: 1px solid transparent; }
.lv1 { background: var(--l1-bg); color: var(--l1); }
.lv2 { background: var(--l2-bg); color: var(--l2); }
.lv3 { background: var(--l3-bg); color: var(--l3); }
.lv4 { background: var(--l4-bg); color: var(--l4); }
.lv0 { background: var(--grid); color: var(--muted); }

/* 歷年分級 */
.pr-years { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.pr-years .card { display: flex; flex-direction: column; gap: 8px; }
.pr-years .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pr-years .date { font-weight: 700; }
.pr-years ul { margin: 0; padding-left: 18px; font-size: 14px; }
.pr-years li { margin: 2px 0; }
.pr-years li.l3, .pr-years li.l4 { font-weight: 600; }
.pr-years .ok { font-size: 14px; color: var(--muted); }
.pr-years .sp { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; }
.pr-years .sp:empty { display: none; }
/* 健康管理重點 */
.pr-focus { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .pr-focus { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .pr-focus { grid-template-columns: 1fr; } }
.pr-focus .fx-track { margin-left: 6px; vertical-align: 1px; }
@media print { .pr-focus .fx-track { display: none; } }
.pr-focus .fx-col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.pr-focus .fx-wide { grid-column: 1 / -1; }
.pr-focus .fx-appt { border-left: 4px solid var(--brand); }
.pr .pr-sub { font-size: 16px; margin: 18px 0 8px; }
.pr .pr-met { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.pr .pr-met li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 14px; }
.pr .pr-met li:first-child { border-top: 0; }
.pr .pr-met .num { font-weight: 700; }
.pr .pr-met .tag { font-size: 13px; color: var(--muted); }
.pr-focus h3 { font-size: 15px; margin: 0 0 8px; }
.pr-focus h3:not(:first-child) { margin-top: 14px; }
.pr-focus p { margin: 4px 0; font-size: 14px; }
.pr-focus ul { margin: 0; padding-left: 20px; font-size: 14px; }
.pr-focus li { margin: 3px 0; }
.fx-warn { color: var(--l3); font-weight: 700; }
.fx-risk.r0 { color: var(--l1); } .fx-risk.r1, .fx-risk.r2 { color: var(--l3); } .fx-risk.r3, .fx-risk.r4 { color: var(--l4); }
.fx-dates li.fx-next { font-weight: 700; }
.badge.fx-soon { background: var(--l3-bg); color: var(--l3); }
.badge.fx-hint { background: var(--l3-bg); color: var(--l3); font-size: 12px; }
.badge.fx-pend { background: var(--l4-bg); color: var(--l4); font-size: 12px; }
.badge.fx-done { background: var(--l1-bg); color: var(--l1); font-size: 12px; }
/* 「已追蹤」可以按掉：按一下變成「取消追蹤？再按一次」 */
button.badge.fx-undo { font: inherit; font-size: 12px; font-weight: 600; border: 1px solid transparent; cursor: pointer; }
button.badge.fx-undo .x { margin-left: 4px; font-size: 10px; opacity: .7; }
button.badge.fx-undo:hover { border-color: var(--l1); }
button.badge.fx-undo:focus-visible { outline: 2px solid var(--focus, var(--l1)); outline-offset: 1px; }
button.badge.fx-undo.sure { background: var(--l4-bg); color: var(--l4); border-color: var(--l4); }
.pr-index .tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.pr-index .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.pr-years .card:not(.aligned) .rest:empty { display: none; }
.pr-years .cap { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; margin: 4px 0 2px; }
/* 每年都有的項目放在同一排（支援 subgrid 的瀏覽器） */
@supports (grid-template-rows: subgrid) {
  .pr-years .card.aligned { display: grid; grid-row: span var(--rows); grid-template-rows: subgrid; row-gap: 2px; align-content: start; }
  .pr-years .card.aligned > .top { margin-bottom: 6px; }
  .pr-years .card.aligned ul.common { display: grid; grid-row: span var(--items); grid-template-rows: subgrid; row-gap: 2px; }
  .pr-years .card.aligned li { margin: 0; }
  .pr-years .card.aligned .c-span { grid-row: span var(--items); }
  .pr-years .card.aligned .rest { align-self: start; }
  .pr-years .card.aligned .sp { align-self: end; margin-top: 6px; }
}


/* 趨勢圖 */
.pr-charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.chart { padding: 12px 12px 8px; }
.chart .ttl { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.chart .unit { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.chart .last { font-size: 13px; color: var(--muted); white-space: nowrap; }
.chart .last b { color: var(--ink); font-size: 16px; }
.chart svg { display: block; width: 100%; height: auto; margin-top: 4px; overflow: visible; }
.chart .ax { fill: var(--muted); font-size: 11px; }
.chart .vl { fill: var(--ink); font-size: 11px; font-weight: 600; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--muted); stroke-width: 1.6; }
.chart .ln.b { stroke-dasharray: 4 3; }
.chart .key { font-size: 12px; color: var(--muted); margin-top: 2px; }
.chart .key i { display: inline-block; width: 16px; border-top: 2px solid var(--muted); vertical-align: middle; margin: 0 4px 2px 0; }
.chart .key i.b { border-top-style: dashed; }
.chart .key span + span { margin-left: 10px; }
.d1 { fill: var(--dot1); } .d2 { fill: var(--dot2); } .d3 { fill: var(--dot3); } .d4 { fill: var(--dot4); } .d0 { fill: var(--dot0); }
.dx { fill: var(--l4); }
/* 不分級的項目超出標準值：紅字 */
.pr td.oor { color: var(--l4); font-weight: 700; }
.oor-key { color: var(--l4); margin-right: 2px; }
.pt { stroke: var(--panel); stroke-width: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
.legend svg { width: 10px; height: 10px; vertical-align: -1px; margin-right: 4px; }

/* 表格 */
.tbl-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.pr table { border-collapse: collapse; width: 100%; font-size: 14px; }
.pr th, .pr td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.pr thead th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; }
.pr tbody tr:last-child td, .pr tbody tr:last-child th { border-bottom: 0; }
.pr tbody th { font-weight: 600; white-space: nowrap; position: sticky; left: 0; background: var(--panel); }
.pr tbody th .unit { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
.pr th.c { text-align: center; }
.pr td.c { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pr td.lv2, .pr td.lv3, .pr td.lv4 { font-weight: 700; }
.pr td.lv1 { background: transparent; color: inherit; }

/* 報告文字 */
.pr-text { display: grid; gap: 12px; }
.pr-text dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; }
.pr-text dt { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pr-text dd { margin: 0; }
.pr-text dd .badge { margin-right: 6px; font-size: 12px; }

/* 諮詢 */
.pr-consults { display: grid; gap: 12px; }
.consult .top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 8px; }
.consult .date { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.consult .tag { font-size: 13px; color: var(--muted); }
.consult .st { display: inline-block; font-size: 13px; background: var(--grid); border-radius: 6px; padding: 1px 8px; margin: 0 6px 4px 0; }
.consult dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 14px; }
.consult dt { color: var(--muted); white-space: nowrap; }
.consult dd { margin: 0; white-space: pre-wrap; }
.closed-yes { background: var(--l1-bg); color: var(--l1); }
.closed-no { background: var(--l2-bg); color: var(--l2); }

/* 問卷 */
.risk-低 { background: var(--l1-bg); color: var(--l1); }
.risk-中 { background: var(--l2-bg); color: var(--l2); }
.risk-高 { background: var(--l4-bg); color: var(--l4); }

/* 掃描檔 */
.pr-files { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.pr-files ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.pr-files li { margin: 3px 0; word-break: break-all; }

.pr-foot { margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

/* 人員清單 */
.pr-index .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 16px 0 12px; }
.pr-index input[type="search"] { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--ink); min-width: 0; width: min(360px, 100%); }
.pr-index input[type="search"]:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.pr-index td a { font-weight: 600; }

@media (max-width: 640px) {
  .pr { padding: 16px 16px 40px; }
  .pr h1 { font-size: 22px; }
  .pr-head .latest { text-align: left; }
  .pr-text dl, .consult dl { grid-template-columns: 1fr; gap: 0 0; }
  .pr-text dd, .consult dd { margin-bottom: 6px; }
}
@media print {
  :root { --bg: #fff; --panel: #fff; --ink: #000; --muted: #444; --line: #bbb; --grid: #eee; }
  body { font-size: 12px; }
  .pr { max-width: none; padding: 0; }
  .pr-toc, .pr-index .tools { display: none; }
  .pr section { margin-top: 16px; break-inside: auto; }
  .card, .chart, .consult, tr { break-inside: avoid; }
  .pr h2 { break-after: avoid; }
  .pr details.sec > summary::before { display: none; }
  .tbl-wrap { overflow: visible; border: 0; }
  .pr thead th, .pr tbody th { position: static; }
  .badge, .lv2, .lv3, .lv4, .pt { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* 檢查數值：分類、趨勢鈕 */
.pr .tools-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin: -4px 0 10px; }
.pr .tools-row .legend { margin: 0; }
.pr .tgls { display: flex; gap: 6px; }
.pr .tgl, .pr .tbtn { appearance: none; font: inherit; font-size: 13px; line-height: 1.4; cursor: pointer; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 3px 12px; white-space: nowrap; }
.pr .tgl:hover, .pr .tbtn:hover { border-color: var(--brand); color: var(--brand); }
.pr .tgl:focus-visible, .pr .tbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.pr .tbtn::after { content: "▾"; margin-left: 4px; font-size: 11px; }
.pr .tbtn[aria-expanded="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.pr .tbtn[aria-expanded="true"]::after { content: "▴"; }
.pr td.tb, .pr th.tb { width: 1%; text-align: right; white-space: nowrap; }
.pr table.vals tr.grp th { position: static; background: var(--bg); color: var(--ink); font-size: 13px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.pr table.vals tr.grp th span { position: sticky; left: 10px; }
.pr table.vals tbody tr.grp:first-child th { border-top: 0; }
.pr tr.trend-row td { background: var(--bg); padding: 10px 12px 14px; }
.pr .trend-box { position: sticky; left: 12px; width: min(520px, calc(100vw - 72px)); min-width: 280px; }
.pr table.vals thead th:first-child { left: 0; z-index: 2; }
.pr .trend-box .tb-h { font-size: 13px; color: var(--muted); }
.pr .trend-box .tb-h b { color: var(--ink); font-size: 14px; margin-right: 6px; }
.pr .trend-box svg { display: block; width: 100%; height: auto; margin-top: 2px; overflow: visible; }
.pr .trend-box .ax { fill: var(--muted); font-size: 11px; }
.pr .trend-box .vl { fill: var(--ink); font-size: 11px; font-weight: 600; }
.pr .trend-box .gl { stroke: var(--line); stroke-width: 1; }
.pr .trend-box .ln { fill: none; stroke: var(--muted); stroke-width: 1.6; }
.pr .trend-box .ln.b { stroke-dasharray: 4 3; }
.pr .trend-box .key { font-size: 12px; color: var(--muted); }
.pr .trend-box .key i { display: inline-block; width: 16px; border-top: 2px solid var(--muted); vertical-align: middle; margin: 0 4px 2px 0; }
.pr .trend-box .key i.b { border-top-style: dashed; }
.pr .trend-box .key span + span { margin-left: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* 往下拉時浮在上面的年份列（檢查數值表的標題列複製一份） */
.pr .vals-float { position: sticky; top: var(--vals-top, 0px); z-index: 3; height: 0; }
.pr .vals-float .vf-in { overflow: hidden; visibility: hidden; background: var(--panel); border: 1px solid var(--line); border-bottom-color: var(--muted);
  border-radius: 0 0 6px 6px; box-shadow: 0 4px 10px rgba(0, 0, 0, .08); }
.pr .vals-float.on .vf-in { visibility: visible; }
.pr .vals-float table { table-layout: fixed; }
.pr table.vals th.yr { line-height: 1.25; vertical-align: bottom; }
.pr table.vals th.yr .y { display: block; color: var(--ink); font-size: 14px; }
.pr table.vals th.yr .md { display: block; font-size: 11px; font-weight: 400; }
/* 最新一次（最右邊那欄）：淡底色；有分級顏色的格子照分級顏色 */
.pr table.vals th.now { background: var(--now-bg); color: var(--brand); }
.pr table.vals th.now .y { color: var(--brand); }
.pr table.vals td.now:not(.lv2):not(.lv3):not(.lv4) { background: var(--now-bg); }
.pr .vals-float thead th { color: var(--ink); }
@media print {
  .pr .vals-float { display: none; }
  .pr .tgls, .pr .tbtn, .pr th.tb, .pr td.tb { display: none; }
  .pr .trend-box { position: static; width: 70%; }
}

/* ---------- 電子問卷 ---------- */
.f-wrapall { font-size: 15px; }
.f-head { display: flex; flex-wrap: wrap; gap: 4px 20px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); }
.f-tabs { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 0; font-size: 14px; }
.f-tabs a { color: var(--brand); }
.f-form { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 16px; }
.f-form h3 { font-size: 17px; margin: 0 0 8px; text-align: center; }
.f-sec { border: 0; border-top: 1px solid var(--line); margin: 12px 0 0; padding: 10px 0 0; min-width: 0; }
.f-sec legend { font-weight: 700; padding: 0 6px 0 0; }
.f-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 20px; margin-top: 6px; }
.f-grid label, .f-grid > div { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.f-exam label { justify-content: flex-start; }
.f-line { margin: 8px 0 2px; line-height: 2; }
.f-sub { margin: 2px 0 6px 22px; line-height: 2; }
.f-col > * { display: block; }
.f-col > .f-ck { display: flex; width: fit-content; }      /* 一個選項一行 */
.f-wrap { display: flex; flex-wrap: wrap; gap: 0 14px; line-height: 2; }
.f-ck { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; cursor: pointer; }
.f-ck input { width: 17px; height: 17px; margin: 0; accent-color: var(--brand); }
.f-rd { display: inline-flex; flex-wrap: wrap; }
.f-in, .f-ta { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
.f-in { width: 11em; max-width: 100%; line-height: 1.4; vertical-align: middle; }
.f-ta { line-height: 1.6; }
.f-ck { vertical-align: middle; }
.f-in.f-s { width: 4.5em; }
.f-in.f-m { width: 9em; }
.f-in.f-l { width: 22em; }
.f-ta { display: block; width: 100%; resize: vertical; }
.f-in:focus, .f-ta:focus, .f-ck input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.f-u { color: var(--muted); font-size: 13px; }
.f-q { margin: 8px 0; }
.f-q > div:first-child { font-weight: 600; }
.f-score { margin: 8px 0 0; padding: 6px 10px; background: var(--grid); border-radius: 6px; }
.f-score:empty { display: none; }
.f-note, .f-muted { color: var(--muted); font-size: 13px; }
.f-shift { text-align: center; margin: 0 0 6px; }
.f-tbl { border-collapse: collapse; width: 100%; }
.f-tbl th, .f-tbl td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
.f-tbl tbody th { text-align: left; font-weight: 500; }
.f-tbl .f-c { margin: 0; justify-content: center; }
.f-red th, .f-red td { color: var(--l4); }
.f-total td { text-align: right; }
/* 職護評估：表一～表四 */
.f-nurse h4 { font-size: 15px; margin: 18px 0 6px; }
.f-ref { font-size: 14px; }
.f-ref td.f-l { text-align: left; }
.f-ref .f-hit, .f-ref tr.f-hit > * { background: var(--grid); }
.f-ref td.f-hit, .f-ref tr.f-hit td[data-w] { outline: 2px solid var(--brand); outline-offset: -2px; font-weight: 600; }
.f-ref .f-now th, .f-ref .f-now td { font-weight: 600; }
.f-src { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.f-mk { display: block; }
.f-t3 td[data-w] { white-space: nowrap; min-width: 6em; }
.f-result { font-size: 15px; }
.f-sum { display: grid; gap: 4px; margin: 4px 0 10px; padding: 10px 14px; border: 2px solid var(--brand); border-radius: 8px; background: var(--grid); }
.f-sum > div { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.f-sum span { min-width: 15em; color: var(--muted); }
.f-nurse { border-style: dashed; }
.f-ro .f-ck, .f-ro input { pointer-events: none; cursor: default; }
.f-ro .f-in, .f-ro .f-ta { border: 0; border-bottom: 1px dotted var(--muted); border-radius: 0; background: transparent; }
.f-exam { container-type: inline-size; }
.f-exam .f-exrow { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.f-exam .f-exrow:last-child { border-bottom: 0; }
.f-exam .f-exg { font-size: 13px; font-weight: 700; color: var(--muted); }
.f-exam .f-exgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 16px; margin-top: 0; }
@container (max-width: 1040px) { .f-exam .f-exgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container (max-width: 520px) { .f-exam .f-exrow { grid-template-columns: 1fr; } }
.f-exam label { flex-wrap: nowrap; }
.f-exam .f-exl { flex: 0 0 6.2em; }
.f-exam .f-in { width: 5.5em; min-width: 0; }
.f-exam .f-u { white-space: nowrap; }
.fbtn { font: inherit; font-size: 14px; font-weight: 600; margin-top: 6px; padding: 5px 14px; border: 1px solid var(--brand); border-radius: 999px;
  background: var(--panel); color: var(--brand); cursor: pointer; white-space: nowrap; }
.fbtn:hover { background: var(--brand); color: var(--brand-ink); }
.fbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.c-tools { margin-left: auto; display: inline-flex; gap: 6px; }
.pr .btn.small, .pr-dlg .btn.small { font: inherit; font-size: 13px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--ink); cursor: pointer; }
.pr .btn.small.primary, .pr-dlg .btn.small.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.pr-dlg { width: min(980px, calc(100vw - 24px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--bg); color: var(--ink); }
.pr-dlg::backdrop { background: rgba(0, 0, 0, .45); }
.pr-dlg .dlg-bar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
.pr-dlg .dlg-bar .sp { flex: 1; }
.pr-dlg .dlg-bar { flex-wrap: wrap; }
.pr-dlg .dlg-bar .btn.small { font-size: 14px; font-weight: 600; padding: 6px 14px; }   /* 跟填寫畫面的按鈕一樣大 */
/* 下載 Word：已填｜空白（三頁、填寫畫面都一樣） */
.word-grp { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.word-grp .word-l { display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--grid);
  border-right: 1px solid var(--line); white-space: nowrap; }
.word-grp .btn, .pr-dlg .word-grp .btn.small { border: 0; border-radius: 0; margin: 0; }
.word-grp .btn + .btn { border-left: 1px solid var(--line); }
.word-grp .btn:disabled { opacity: .45; cursor: not-allowed; }
.pr-dlg .dlg-bar [data-msg] { font-size: 13px; }
.pr-dlg .dlg-body { padding: 12px 14px 20px; }
.pr-print { display: none; }
/* 健康諮詢附件 */
.cs-att .att-list { display: grid; gap: 8px; margin-bottom: 8px; }
.cs-att .att-row { display: flex; gap: 10px; align-items: flex-start; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.cs-att .att-grip { flex: 0 0 auto; align-self: center; padding: 6px 2px; color: var(--muted); font-weight: 700; letter-spacing: -2px; cursor: grab; user-select: none; }
.cs-att .att-grip:active { cursor: grabbing; }
.cs-att .att-row.dragging { opacity: .45; }
.cs-att .att-row.drop-before { box-shadow: 0 -3px 0 0 var(--focus); }
.cs-att .att-row.drop-after { box-shadow: 0 3px 0 0 var(--focus); }
.cs-att .att-th { flex: 0 0 72px; width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; border-radius: 6px; overflow: hidden;
  background: var(--grid); color: var(--muted); font-size: 12px; font-weight: 700; text-decoration: none; }
.cs-att .att-th img { width: 100%; height: 100%; object-fit: cover; }
.cs-att .att-main { flex: 1 1 auto; min-width: 0; display: grid; gap: 4px; }
.cs-att .att-nm { font-size: 13px; overflow-wrap: anywhere; }
.cs-att .att-opt { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.cs-att .att-note { flex: 1 1 14em; min-width: 10em; }
.cs-att .att-lay { display: inline-flex; gap: 10px; }
.cs-att .att-lay[hidden] { display: none; }
.cs-att .att-sum, .att-print { display: none; }
@media print {
  .pr-print .cs-att .att-edit { display: none; }
  .pr-print .cs-att .att-sum { display: block; margin: 2px 0; }
  .pr-print .att-print { display: block; }
  .pr-print .att-sheet { break-before: page; page-break-before: always; display: flex; flex-direction: column; gap: 5mm; }
  .pr-print .att-hd { font-size: 11px; color: #444; }
  .pr-print .att-sheet figure { margin: 0; text-align: center; break-inside: avoid; }
  .pr-print .att-n1 img { max-width: 100%; max-height: 235mm; }
  .pr-print .att-n2 img { max-width: 100%; max-height: 112mm; }
  .pr-print .att-sheet figcaption { font-size: 11px; margin-top: 2mm; }
}
@media print {
  body.pr-printing > *:not(.pr-print) { display: none !important; }
  body.pr-printing .pr-print { display: block; }
  .pr-print .f-tabs, .pr-print .f-muted, .pr-print [data-riskauto] { display: none; }
  .pr-print .f-eval h4 { break-after: avoid; margin-top: 10px; }
  .pr-print .f-ref { break-inside: avoid; font-size: 11px; }
  .pr-print .f-ref .f-hit, .pr-print .f-ref tr.f-hit > *, .pr-print .f-sum { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pr-print .f-form { border: 0; padding: 0; margin-top: 10px; break-before: page; }
  .pr-print .f-form:first-of-type { break-before: auto; }
  .pr-print .f-in, .pr-print .f-ta { border: 0; border-bottom: 1px solid #999; border-radius: 0; background: transparent; padding: 0 4px; }
  .pr-print .f-wrapall { font-size: 11.5px; }
  .pr-print .f-line, .pr-print .f-sub, .pr-print .f-wrap { line-height: 1.55; margin-top: 3px; margin-bottom: 1px; }
  .pr-print .f-sec { margin-top: 6px; padding-top: 4px; }
  .pr-print .f-grid { gap: 2px 16px; }
  .pr-print .f-q { margin: 3px 0; }
  .pr-print .f-head { padding: 4px 8px; }
  .pr-print .f-ck input { width: 13px; height: 13px; }
  .fbtn, .c-tools { display: none; }
}

/* 列印範圍 */
.pr-printbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 0; font-size: 14px; }
.pr-printbar select { font: inherit; font-size: 14px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
@media print {
  .pr-printbar { display: none; }
  .pr > section.pr-noprint { display: none !important; }
}

/* 員工自填問卷：必填 */
.f-req { margin: 8px 0 0; font-size: 14px; color: var(--l4); font-weight: 600; }
.f-miss { outline: 2px solid var(--l4); outline-offset: 3px; border-radius: 6px; background: var(--l4-bg); }
@media print { .f-req { display: none; } .f-miss { outline: none; background: none; } }

/* 過負荷評估：表頭三個按鈕、視窗裡的三頁 */
.ow-btns { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 6px; padding: 8px 8px 10px;
  border: 1px dashed var(--brand); border-radius: 10px; }
.ow-btns::before { content: "過負荷評估"; font-size: 12px; font-weight: 600; color: var(--brand); }
.ow-btns .fbtn { margin-top: 0; white-space: normal; max-width: 15em; }
.ow-steps { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--grid); }
.ow-steps button { font: inherit; font-size: 14px; font-weight: 600; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--brand);
  background: var(--panel); color: var(--brand); cursor: pointer; }
.ow-steps button.on { background: var(--brand); color: var(--brand-ink); }
.ow-steps button .muted { font-weight: 400; margin-left: 2px; }
.ow-steps button.on .muted { color: inherit; opacity: .85; }
.ow-steps button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.pr-print .f8-side { display: none !important; }
.pr-print .f8-split { display: block; }

/* 右下角回到最上面 */
.pr-top { position: fixed; right: 20px; bottom: 24px; z-index: 20; width: 46px; height: 46px; display: grid; place-items: center;
  border: none; border-radius: 50%; background: var(--brand); color: var(--brand-ink); box-shadow: 0 3px 10px rgba(0, 0, 0, .22); cursor: pointer; }
.pr-top[hidden] { display: none; }
.pr-top:hover { filter: brightness(1.1); }
.pr-top:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
@media print { .pr-top { display: none !important; } }

/* 人因性危害：ROSA 辦公作業人因檢核表（座椅橘、螢幕及電話綠、滑鼠及鍵盤藍，跟紙本一樣） */
.rosa .rosa-grp { margin-top: 14px; padding: 8px 12px 4px; border: 1px solid var(--line); border-left-width: 5px; border-radius: 10px; }
.rosa .rosa-chair { border-left-color: #e8956b; }
.rosa .rosa-scr { border-left-color: #79ad5f; }
.rosa .rosa-mk { border-left-color: #5f9bd3; }
.rosa .rosa-grp h4 { margin: 2px 0 4px; font-size: 16px; }
.rosa-t { width: 100%; border-collapse: collapse; margin: 6px 0; }
.rosa-t td, .rosa-t th { border: 1px solid var(--line); padding: 4px 8px; vertical-align: middle; }
.rosa-t .rosa-h th { text-align: left; background: var(--grid); }
.rosa-t .rosa-no { width: 3em; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rosa-t .rosa-pt { width: 3.4em; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rosa-t .f-ck { margin: 0; display: flex; align-items: flex-start; gap: 6px; }
.rosa-t .f-ck input { margin-top: 3px; flex: none; }
.rosa-t tr:has(input:checked) td { background: color-mix(in srgb, var(--brand) 9%, transparent); }
.rosa-t tr:has(input:checked) .rosa-pt { font-weight: 700; color: var(--brand); }
.rosa-t tr.f-miss td { background: var(--l4-bg); }
.rosa-sub { margin: 2px 0 8px; text-align: right; }
.rosa-sum { font-weight: 600; }
.rosa-total { margin-top: 14px; padding: 10px 14px; border-radius: 10px; background: var(--grid); }
.rosa-total p { margin: 4px 0; }
.rosa-final { font-size: 18px; }

/* 人因性危害：BAuA 基礎檢核及初篩（建議 KIM 表） */
.baua .bu-basic, .baua .bu-sum { width: 100%; border-collapse: collapse; }
.baua .bu-basic th, .baua .bu-basic td, .baua .bu-sum th, .baua .bu-sum td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
.baua .bu-basic thead th, .baua .bu-sum thead th { background: var(--grid); }
.baua .bu-basic tbody th { width: 9em; }
.baua .bu-basic td:nth-child(4) { width: 9em; white-space: nowrap; }
.baua .bu-basic tr.f-miss td, .baua .bu-basic tr.f-miss th { background: var(--l4-bg); }
.baua .bu-sum .c { text-align: center; white-space: nowrap; }
.baua .bu-type > legend .badge { margin-left: 6px; }
.baua .bu-step { margin: 6px 0 10px; }
.baua .bu-step p { margin: 4px 0; }
.baua .bu-step.f-miss, .baua .bu-need.f-miss { outline: 2px solid var(--l4); outline-offset: 4px; border-radius: 6px; }
.baua .bu-g { margin: 8px 0; padding-left: 2px; }
.baua .bu-gt { margin: 6px 0 2px; font-weight: 600; }
.baua .bu-it .f-ck, .baua .bu-flag .f-ck { display: flex; align-items: flex-start; gap: 6px; margin: 3px 0; }
.baua .bu-it .f-ck input, .baua .bu-flag .f-ck input { margin-top: 4px; flex: none; }
.baua .bu-flag { padding: 6px 8px; border: 1px dashed var(--line); border-radius: 8px; }
.baua .bu-res { margin: 8px 0 4px; font-weight: 700; color: var(--brand); }
.baua .bu-notes { margin: 6px 0 0; padding-left: 1.2em; font-size: 13px; }
.baua .bu-q { margin: 12px 0 4px; }
.baua .bu-need { margin: 6px 0 10px; }
.baua .bu-need p { margin: 2px 0; }
.baua .bu-advice { margin-top: 14px; padding: 12px 16px; border-radius: 10px; background: var(--grid); border-left: 5px solid var(--brand); }
.baua .bu-adv-h { margin: 0 0 4px; font-weight: 700; font-size: 16px; }
.baua .bu-adv-t { margin: 0 0 6px; font-size: 17px; font-weight: 700; }
.baua .bu-advice ul { margin: 0; padding-left: 1.2em; }
.baua .f-wide { display: block; grid-column: 1 / -1; margin-top: 6px; }
/* 適性配工、復工評估（工作適能指數、評估表、追蹤紀錄） */
.rtwf .f-wide { display: block; margin-top: 6px; }
.rtwf .f-wide .f-ta { margin-top: 2px; }
.rtwf .f-q.f-col .f-rd { display: flex; flex-direction: column; align-items: flex-start; }
.rtwf .f-q.f-miss, .rtwf .f-sec.f-miss, .rtwf .rtw-it.f-miss, .rtwf .f-line.f-miss, .rtwf [data-g].f-miss { outline: 2px solid var(--l4); outline-offset: 4px; border-radius: 6px; background: var(--l4-bg); }
.rtwf .rtw-it { margin: 3px 0; line-height: 2; }
.rpf .rp-yn-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 10px 0 4px; font-weight: 600; }
.rpf table.rp-yn, .rpf table.rp-ex, .rpf table.rp-fit { border-collapse: collapse; width: 100%; font-size: 14px; }
.rpf .rp-yn th, .rpf .rp-yn td, .rpf .rp-ex th, .rpf .rp-ex td, .rpf .rp-fit th, .rpf .rp-fit td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; font-weight: normal; }
.rpf .rp-yn td:nth-child(2) { white-space: nowrap; width: 1%; }
.rpf .rp-yn tr.f-miss th { color: var(--l4); font-weight: 600; }
.rpf .rp-ex .rp-exr { display: inline-block; margin-right: 10px; }
.rpf .rp-fit th[scope=row] { min-width: 11em; }
.rpf .rp-fit td.rp-stop { background: var(--l4-bg, #fde8e8); outline: 2px solid var(--l4); }
.rpf .rp-fit .f-col { display: flex; flex-direction: column; gap: 2px; }
.rtwf .rtw-it .f-ta { margin: 2px 0 4px; }
.wai-tbl { width: 100%; border-collapse: collapse; margin-top: 12px; }
.wai-tbl th, .wai-tbl td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; }
.wai-tbl thead th { background: var(--grid); }
.wai-tbl .c { text-align: center; white-space: nowrap; width: 8em; }
.wai-tbl .f-total th, .wai-tbl .f-total td { background: var(--grid); }
.pr-wai td:last-child, .pr-rtw td:last-child, .pr-rtwtr td:last-child, .pr-rp td:last-child { white-space: nowrap; width: 1%; }
.pr-rp b.hi { color: var(--l4); }
.baua .f-wide .f-in, .baua .f-wide .f-ta { width: 100%; }

/* 人因性危害：肌肉骨骼症狀調查表（NMQ） */
.nmq .nmq-lv { margin: 4px 0 8px; padding-left: 0; list-style: none; }
.nmq .nmq-lv li { margin: 2px 0; }
.nmq .nmq-lv b { display: inline-block; width: 1.2em; font-variant-numeric: tabular-nums; }
.nmq-scale { border-collapse: collapse; margin: 6px 0 4px; min-width: 560px; }
.nmq-scale th, .nmq-scale td { padding: 3px 6px; text-align: center; vertical-align: middle; font-size: 13px; }
.nmq-scale th { width: 5.5em; font-weight: 600; color: var(--muted); text-align: left; white-space: nowrap; }
.nmq-scale td { width: 15%; }
.nmq-scale .nmq-faces td, .nmq-scale .nmq-top { border-top: 6px solid var(--c); }
.nmq-scale .nmq-faces td { padding-top: 8px; }
.nmq-scale img { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.nmq-scale .nmq-faces img { width: 48px; }
.nmq-scale .nmq-figs img { width: 74px; }
.nmq-scale .nmq-faces td, .nmq-scale .nmq-figs td { background: #fff; }
.nmq-no { display: inline-grid; place-items: center; width: 1.7em; height: 1.7em; border: 1.5px solid currentColor; border-radius: 50%; font-weight: 700; font-variant-numeric: tabular-nums; }
.nmq .nmq-q { margin: 2px 0 8px; }
.nmq .nmq-q p { margin: 2px 0 4px; }
.nmq .nmq-q.f-miss, .nmq .f-line.f-miss, .nmq .nmq-part.f-miss { outline: 2px solid var(--l4); outline-offset: 3px; border-radius: 6px; background: var(--l4-bg); }
.nmq .nmq-off { opacity: .45; }
/* 身體部位：窄的時候圖在上面、部位分兩欄；夠寬（940px 以上）就圖在中間，
   每個部位一樣高（--row），圖的高度＝右邊 8 個部位的高度：圖的頂部、底部跟兩邊的部位對齊 */
.nmq { container-type: inline-size; }
.nmq-body { --row: 58px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; align-items: start; margin: 6px 0; }
.nmq-col { display: grid; gap: 4px; align-content: start; }
.nmq-fig { grid-column: 1 / -1; order: -1; justify-self: center; margin: 0; padding: 6px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
.nmq-fig img { display: block; width: 280px; max-width: 100%; height: auto; }
.nmq-part { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 2px 6px; }
.nmq-nm { display: flex; flex-direction: column; justify-content: center; min-width: 4.8em; line-height: 1.25; }
.nmq-pn { font-weight: 600; }
.nmq-pl { font-size: 12px; color: var(--muted); }
.nmq-pl:empty { display: none; }
@container (max-width: 560px) { .nmq-body { grid-template-columns: 1fr; } }
@container (min-width: 940px) {
  .nmq-body.has-fig { grid-template-columns: 1fr auto 1fr; gap: 0 16px; }
  .nmq-body.has-fig .nmq-fig { grid-column: 2; grid-row: 1; order: 0; padding: 0; border: 0; border-radius: 0; }
  .nmq-body.has-fig .nmq-fig img { width: auto; height: calc(8 * var(--row)); max-width: none; outline: 1px solid var(--line); }
  .nmq-body.has-fig .nmq-col { grid-row: 1; gap: 0; grid-auto-rows: var(--row); }
  .nmq-body.has-fig .nmq-l { grid-column: 1; }
  .nmq-body.has-fig .nmq-r { grid-column: 3; }
  .nmq-body.has-fig .nmq-part { min-height: 0; border-bottom: 1px solid var(--line); }
  .nmq-body.has-fig .nmq-part:first-child { border-top: 1px solid var(--line); }
  .nmq-body.has-fig .nmq-l .nmq-part { justify-content: space-between; }   /* 左邊：分數靠圖 */
}
.nmq-pl[data-v="3"], .nmq-pl[data-v="4"], .nmq-pl[data-v="5"] { color: var(--l4); font-weight: 600; }
.nmq-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: fit-content; }
.nmq-seg label { position: relative; cursor: pointer; }
.nmq-seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.nmq-seg span { display: block; min-width: 2.1em; padding: 4px 0; text-align: center; font-variant-numeric: tabular-nums; border-left: 1px solid var(--line); }
.nmq-seg label:first-child span { border-left: 0; }
.nmq-seg label:hover span { background: var(--grid); }
.nmq-seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: -2px; }
.nmq-seg input:checked + span { background: var(--brand); color: var(--brand-ink); font-weight: 700; }
.nmq-seg label:nth-child(n+4) input:checked + span { background: var(--l4); color: #fff; }
.nmq .nmq-zero { margin: 4px 0 10px; }
.nmq .f-wide { display: block; margin-top: 6px; }
.nmq .f-wide .f-ta { width: 100%; }
.nmq-res { margin-top: 14px; padding: 12px 16px; border-radius: 10px; background: var(--grid); border-left: 5px solid var(--brand); }
.nmq-res p { margin: 3px 0; }
.nmq-res-h { font-weight: 700; font-size: 16px; }
.nmq-res-t { font-weight: 600; }
.nmq-jd { margin-top: 14px; }
.nmq-jd .f-line[hidden] { display: none; }
.nmq-jd-res { margin: 8px 0 0; font-weight: 600; }
.nmq-jd-res:empty { display: none; }
@media print {
  .nmq .nmq-zero { display: none; }
  .nmq-seg input:checked + span { outline: 2px solid #000; }
}
.pr-nmq b.hi { color: var(--l4); }
.pr-hq b.hi { color: var(--l4); }
.pr-hq .hq-src { margin: 6px 0 0; font-size: 13px; }

/* 人因性危害：KIM 關鍵指標法（LHC、MHO、PP、BF、BM、ABP） */
.kim h3 small { font-size: 14px; font-weight: 600; color: var(--muted); }
.kim .kim-head { margin: 6px 0 4px; }
.kim-sec > legend .kim-pts { margin-left: 8px; font-weight: 700; color: var(--brand); font-size: 14px; }
.kim-tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.kim-wide .kim-tbl { min-width: 760px; }
.kim-tbl th, .kim-tbl td { border: 1px solid var(--line); padding: 4px 6px; vertical-align: middle; }
.kim-tbl thead th { background: var(--grid); font-weight: 600; text-align: center; font-size: 13px; line-height: 1.3; }
.kim-tbl thead th img { display: block; margin: 0 auto 2px; max-height: 54px; max-width: 100%; width: auto; height: auto; background: #fff; }
.kim-tbl tbody th { text-align: left; font-weight: 600; white-space: normal; min-width: 11em; }
.kim-tbl .kim-sub { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.kim-tbl .kim-b { font-weight: 700; white-space: nowrap; width: 3em; text-align: center; }
.kim-tbl .kim-c { text-align: center; width: 3.4em; font-variant-numeric: tabular-nums; }
.kim-tbl ul { margin: 0; padding-left: 1.1em; }
.kim-tbl .kim-img { width: 1%; text-align: center; background: #fff; }
.kim-tbl .kim-img img { display: block; margin: 0 auto; max-height: 78px; max-width: 150px; width: auto; height: auto; }
.kim-tbl thead th { white-space: normal; }
.kim-tbl .kim-alt { display: block; font-size: 11px; color: #555; }
.kim-tbl .kim-inl { display: block; max-width: 100%; height: 30px; width: auto; margin-bottom: 4px; background: #fff; }
.kim-tbl td.kim-v { text-align: center; width: 4.2em; padding: 2px; }
.kim-v label { display: block; position: relative; cursor: pointer; }
.kim-v label > input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.kim-v label > span { display: block; padding: 6px 2px; border-radius: 6px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kim-v label:hover > span { background: var(--grid); }
.kim-v label > input:checked + span { background: var(--brand); color: var(--brand-ink); }
.kim-v label > input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: -2px; }
.kim-v sup { font-size: 10px; }
.kim-grey { background: color-mix(in srgb, var(--muted) 20%, transparent); }
.kim-tbl td.kim-na { background: color-mix(in srgb, var(--muted) 10%, transparent); text-align: center; color: var(--muted); }
.kim-off { opacity: .35; }
.kim-off label { cursor: not-allowed; }
.kim-tbl td.kim-hands { width: 5em; }
.kim-hands .kim-hv { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }
.kim-hands .kim-hb { display: flex; gap: 3px; justify-content: center; margin-top: 2px; }
.kim-hand { position: relative; cursor: pointer; }
.kim-hand > input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.kim-hand > span { display: block; padding: 1px 6px; font-size: 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
.kim-hand > input:checked + span { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 700; }
.kim-hand > input:focus-visible + span { outline: 2px solid var(--focus); }
.kim-notes { margin: 6px 0 0; padding-left: 1.2em; font-size: 13px; color: var(--muted); }
.kim-dim { opacity: .45; }
.kim-res { margin-top: 14px; padding: 12px 16px; border-radius: 10px; background: var(--grid); border-left: 5px solid var(--brand); }
.kim-res p { margin: 3px 0; }
.kim-res-h { font-weight: 700; font-size: 16px; }
.kim-formula { font-variant-numeric: tabular-nums; }
.kim-final { font-size: 17px; }
.kim-hints { margin: 4px 0 0; padding-left: 1.2em; color: var(--l3); font-weight: 600; }
.kim-lv { margin-top: 8px; }
.kim-lv summary { cursor: pointer; color: var(--brand); }
.kim-lv table { border-collapse: collapse; width: 100%; margin-top: 6px; font-size: 13px; background: var(--panel); }
.kim-lv th, .kim-lv td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; }
.kim-lv .c { text-align: center; }
.kim-lv tr.on td { background: color-mix(in srgb, var(--brand) 14%, transparent); font-weight: 600; }
.badge.kim-lv1 { background: var(--l1-bg); color: var(--l1); }
.badge.kim-lv2 { background: var(--l2-bg); color: var(--l2); }
.badge.kim-lv3 { background: var(--l3-bg); color: var(--l3); }
.badge.kim-lv4 { background: var(--l4-bg); color: var(--l4); }

/* 手動輸入：基本資料、健檢報告 */
.mx-tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--grid); color: var(--muted); border: 1px solid var(--line); }
.pr-years .card .top .mx-edit { margin-left: 4px; white-space: nowrap; }
.pr-years .card .top .mx-tag { white-space: nowrap; }
.pr-years .card .top { flex-wrap: wrap; row-gap: 4px; }
.mx .mx-g { margin: 10px 0 4px; }
.mx .mx-g h4 { margin: 0 0 6px; font-size: 14px; color: var(--muted); }
.mx .mx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 6px 14px; }
.mx .mx-f { display: flex; align-items: center; gap: 8px; padding: 2px 4px; border-radius: 6px; }
.mx .mx-wide { grid-column: 1 / -1; }
.mx .mx-l { flex: 0 0 8.5em; font-weight: 600; }
.mx .mx-f .f-num { width: 8.5em; flex: 0 0 auto; }
.mx .mx-f .f-wide-in { flex: 1 1 320px; min-width: 0; }
.mx .mx-u { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.mx .mx-f:has(.mx-ref) { flex-wrap: wrap; row-gap: 0; }
.mx .mx-ref { flex: 1 0 100%; padding-left: calc(8.5em + 8px); margin-top: -2px; line-height: 1.2; }
.mx .mx-ref small { font-size: 11.5px; color: var(--muted); }
.mx .mx-more { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 8px; }
.mx .mx-more > summary { cursor: pointer; font-weight: 700; color: var(--brand); padding: 4px 0; }
.mx .mx-f select.f-in { width: 8.5em; flex: 0 0 auto; }
.mx .mx-hb { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; }
.mx .mx-f .f-xs { width: 4.5em; flex: 0 0 auto; }
.mx .f-miss { outline: 2px solid var(--l4); outline-offset: 2px; border-radius: 6px; background: var(--l4-bg); }
.mx-res { margin-top: 14px; padding: 12px 16px; border-radius: 10px; background: var(--grid); border-left: 5px solid var(--brand); }
.mx-res p { margin: 3px 0; }
.mx-res-h { font-weight: 700; font-size: 16px; }
.mx-res ul { margin: 4px 0; padding-left: 1.2em; }
.mx-res li.l2 { color: var(--l2); } .mx-res li.l3 { color: var(--l3); } .mx-res li.l4 { color: var(--l4); font-weight: 600; }

/* 肌肉骨骼症狀：醫護判定的註記 */
.pr .nmq-jd-note { display: block; font-size: 12px; margin-top: 2px; }

/* 追蹤紀錄（異常負荷、人因性危害） */
.pr .pr-track { list-style: none; margin: 0 0 8px; padding: 0; font-size: 14px; }
.pr .pr-track li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--grid); }
.pr .pr-track .num { font-weight: 600; min-width: 6.5em; }
@media print { .pr .pr-track .btn { display: none; } }
.pr .pr-track .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }

/* 「CHC健康管理平台」工具本身的版面（健康總覽的樣式在 view.css） */
.app { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
.tool-head h1 { font-size: 26px; margin: 0 0 6px; display: flex; align-items: center; gap: 12px; }
.tool-head h1 .logo { height: 44px; width: auto; flex: none; }
.tool-head p { margin: 0; color: var(--muted); max-width: 72ch; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-top: 18px; }
#pick { padding: 14px 18px; }
#pick h2 { margin-bottom: 6px; }
.panel h2 { font-size: 18px; margin: 0 0 10px; }
.note { margin: 0 0 6px; }
.need { margin: 0 0 14px; padding-left: 20px; color: var(--ink); }
.need li { margin: 2px 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.privacy { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
.btn { appearance: none; display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 14px; font-weight: 600;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { color: var(--brand-ink); filter: brightness(1.08); }
.status { font-size: 14px; color: var(--muted); }
.status.err { color: var(--l4); }
.sum { margin: 0; padding-left: 20px; }
.sum li { margin: 3px 0; }
.sum .warn { color: var(--l3); }
details summary { cursor: pointer; color: var(--l3); margin-top: 8px; }
.files { font-size: 13px; color: var(--muted); max-height: 220px; overflow: auto; margin: 6px 0 0; padding-left: 20px; }
.list-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 10px; }
.list-head h2 { margin: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; flex: 0 1 auto; }
.filters input[type="search"], .filters select { font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--ink); min-width: 0; }
.filters input[type="search"] { width: 280px; max-width: 100%; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 12px; }
.list-wrap { max-height: 70vh; overflow: auto; }
table.list { border-collapse: collapse; width: 100%; font-size: 14px; }
table.list th, table.list td { white-space: nowrap; padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.list thead th { position: sticky; top: 0; z-index: 1; background: var(--panel); color: var(--muted); font-weight: 600; font-size: 13px; }
table.list tbody tr:last-child td { border-bottom: 0; }
table.list .c { text-align: center; font-variant-numeric: tabular-nums; }
table.list .num { font-variant-numeric: tabular-nums; }
table.list .ck { width: 36px; }
table.list.no-city th[data-sort="city"], table.list.no-city td.city { display: none; }
table.list input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--brand); }
table.list tbody tr { cursor: pointer; }
table.list tbody tr:hover td { background: var(--grid); }
table.list td.name button { appearance: none; border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--brand); cursor: pointer; text-decoration: underline; }
#profile .bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px var(--wp); margin: 0 calc(-1 * var(--wp)); border-bottom: 1px solid var(--line); }
#profile .win-body > .bar:first-of-type { z-index: 4; }   /* 健康計畫問卷選單要蓋在下一排上面 */
#view .pr { padding-left: 0; padding-right: 0; }
@media (max-width: 640px) {
  .app { padding: 16px 16px 40px; }
  .tool-head h1 { font-size: 22px; }
  .tool-head h1 .logo { height: 36px; }
}
@media print {
  .tool-head, #pick, #sum, #listPanel, #profile .bar, #apptPage .appt-bar { display: none !important; }
  .app { padding: 0; max-width: none; }
}

/* 加入資料 */
.drop { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 10px 12px; border: 2px dashed var(--line);
  border-radius: var(--radius); background: var(--bg); transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--brand); background: var(--panel); }
.drop-hint { color: var(--muted); font-size: 14px; }
#status { margin: 10px 0 0; }
.file-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0 0; font-size: 14px; }
.file-btns { display: inline-flex; gap: 6px; }
#fileWrap { margin-top: 8px; }
.need-box { margin: 0 0 10px; font-size: 14px; }
.need-box > summary { color: var(--brand); margin-top: 0; }
.need-box .note { margin: 6px 0; }
#pick .privacy { margin: 8px 0 0; }
.btn.small { padding: 4px 10px; font-size: 13px; font-weight: 500; }
.file-wrap { max-height: 320px; overflow: auto; }
table.files-tbl td { white-space: normal; vertical-align: top; }
table.files-tbl td.f { word-break: break-all; min-width: 200px; }
table.files-tbl td.t { white-space: nowrap; }
table.files-tbl tr.warn td.d { color: var(--l3); }
table.files-tbl tr.quiet td { color: var(--muted); }
table.files-tbl tbody tr { cursor: default; }
table.files-tbl tbody tr:hover td { background: transparent; }
.rm { appearance: none; border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; cursor: pointer; border-radius: 6px; }
.rm:hover { color: var(--l4); background: var(--l4-bg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ow-date { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted, inherit); }
.ow-date input { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
.add-scan { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.leave-mark { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
.leave-box { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.leave-box[hidden] { display: none; }
.leave-unk { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.leave-box input:disabled { opacity: .45; }
.leave-box input[type="date"] { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
.add-scan select { font: inherit; font-size: 14px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
.list-head h2 .status { font-weight: 400; margin-left: 8px; }
.warn-t { color: var(--l3); margin-left: 4px; }
/* 紀錄資料夾、衛教單張資料夾 */
.sub-pick { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
#recNote { font-size: 13px; margin: 0 0 4px; }
.sub-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 6px 0; }
.sub-row > b { min-width: 7em; }
#recNote { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
/* 編輯畫面 */
#editor .ed-bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px var(--wp); margin: 0 calc(-1 * var(--wp)) 12px; border-bottom: 1px solid var(--line); }
.ed-role { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.ed-role label { display: inline-flex; align-items: center; gap: 3px; }
.ed-role .ed-staff { width: 6.5em; margin-right: 6px; font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
.cs-st { margin: 4px 0; }
.cs-st .f-sub { margin-top: 0; }
.cs-ho { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 16px; }
.cs-cat .f-sub a { font-size: 13px; }
[hidden] { display: none !important; }
@media print {
  .tool-head, #pick, #listPanel, .actions, #editor .ed-bar { display: none !important; }
}
.f8-act { white-space: nowrap; }
.f8-act .btn + .btn { margin-left: 6px; }
#f8Panel .list-head h2 { font-size: 18px; }

/* 人員清單：只看建議做過負荷評估 */
label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; cursor: pointer; }
label.chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--brand); }

/* 個人頁最上面：過負荷評估（三個合在一起） */
/* 健康計畫問卷選單：點問卷名稱才展開它的幾個部分；還沒做的顯示「準備中」 */
.plan-menu { position: relative; display: inline-block; }
.plan-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; width: max-content; min-width: 300px; max-width: calc(100vw - 32px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, .16); padding: 6px; }
.pm-it { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; font-size: 15px; padding: 9px 12px;
  border: 0; border-radius: 8px; background: none; color: var(--ink); cursor: pointer; }
.pm-it:hover:not(:disabled), .pm-it:focus-visible { background: var(--bg); }
.pm-grp { font-weight: 700; }
.pm-caret { margin-left: auto; color: var(--muted); transition: transform .15s; }
.pm-grp[aria-expanded="true"] .pm-caret { transform: rotate(90deg); }
.pm-sub { margin: 0 0 6px 14px; padding-left: 6px; border-left: 2px solid var(--brand); }
.pm-sub .pm-it { font-size: 14px; }
.pm-it:disabled { color: var(--muted); cursor: default; }
.pm-soon { margin-left: auto; font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }

/* 預約面談 */
.appt-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.appt-list { list-style: none; margin: 6px 0 0; padding: 0; }
.appt-it { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.appt-it:first-child { border-top: 0; }
.appt-when { font-weight: 700; padding-top: 1px; }

/* 跳出來的視窗：預約月曆、個人健康總覽、問卷／健康諮詢／附表八
   一層疊一層，最上面那層後面變暗；關掉就回到底下那一層 */
html.win-on, html.win-on body { overflow: hidden; }
.win { position: fixed; inset: 0; z-index: 60; background: transparent; }
.win.top { background: rgba(15, 23, 32, .42); }
.win-box { position: absolute; top: calc(16px + var(--d, 0) * 22px); bottom: 16px; left: 0; right: 0; margin: 0 auto;
  width: min(calc(var(--win-w, 1180px) - var(--d, 0) * 44px), calc(100vw - 32px - var(--d, 0) * 44px));
  display: flex; flex-direction: column; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 22px 60px rgba(0, 0, 0, .3); overflow: hidden; outline: none; }
.win:not(.top) .win-box { box-shadow: 0 8px 24px rgba(0, 0, 0, .16); }
.win-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
.win-title { flex: 1; min-width: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win-x { flex: none; }
.win-body { --wp: 18px; flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 0 var(--wp) 28px; }
#apptPage { --win-w: 1240px; }
body.ed-wide #editor { --win-w: 1440px; }
.win-body :is(section, .f-form) { scroll-margin-top: 72px; }
.win .ed-side, .win .f8-side { max-height: calc(100vh - 190px); }
html.win-on .pr-top { z-index: 90; }
.win.win-in.top .win-box { animation: win-in .16s ease-out; }
@keyframes win-in { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { .win.win-in .win-box { animation: none; } }
@media (max-width: 640px) {
  .win-box { top: 0; bottom: 0; width: 100%; border: 0; border-radius: 0; }
  .win-head { padding-left: 12px; }
  .win-body { --wp: 12px; }
}
@media print {
  html.win-on, html.win-on body { overflow: visible !important; }
  html.win-on .app > :not(.win), .win:not(.top) { display: none !important; }
  .win.top { position: static; background: none; }
  .win.top .win-box { position: static; display: block; width: auto; border: 0; border-radius: 0; box-shadow: none; overflow: visible; animation: none !important; opacity: 1; }
  .win.top .win-body { overflow: visible; padding: 0; }
  .win-head { display: none !important; }
}

<script>

// 電子問卷：過負荷評估問卷、過勞量表、心情溫度計、過負荷預防面談結果及採行措施表
// （畫面、計分、對應到總覽的欄位；匯出的網頁和「個人健康檔案」網頁版共用）
(function (root) {
"use strict";

const esc = (s) => String(s === null || s === undefined ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

// ---------- 題目 ----------
const FREQ = ["總是", "常常", "有時候", "不常", "從未或幾乎從未"];
const SEV = ["很嚴重", "嚴重", "有一些", "輕微", "非常輕微"];
const CB_P = ["你常覺得疲勞嗎？", "你常覺得身體上體力透支嗎？", "你常覺得情緒上心力交瘁嗎？", "你常會覺得，「我快要撐不下去了」嗎？",
  "你常覺得精疲力竭嗎？", "你常常覺得虛弱，好像快要生病了嗎？"];
const CB_W = [["你的工作會令人情緒上心力交瘁嗎？", SEV], ["你的工作會讓你覺得快要累垮了嗎？", SEV], ["你的工作會讓你覺得挫折嗎？", SEV],
  ["工作一整天之後，你覺得精疲力竭嗎？", FREQ], ["上班之前只要想到又要工作一整天，你就覺得沒力嗎？", FREQ],
  ["上班時你會覺得每一刻都很難熬嗎？", FREQ], ["不工作的時候，你有足夠的精力陪朋友或家人嗎？", FREQ]];
const BSRS = ["感覺緊張不安", "覺得容易苦惱或動怒", "感覺憂鬱、心情低落", "覺得比不上別人", "睡眠困難，譬如難以入睡、易睡或早醒"];
const BSRS_OPTS = ["完全沒有", "輕微", "中等程度", "厲害", "非常厲害"];
const HX = [["hx_stroke", "腦中風"], ["hx_lipid", "血脂肪異常"], ["hx_osa", "睡眠相關呼吸疾病（如睡眠呼吸中止症）"],
  ["hx_cns", "中樞神經系統疾病（如癲癇、脊椎疾病）"], ["hx_pns", "周邊神經系統疾病（如腕隧道症候群）"], ["hx_psy", "情感或心理疾病"],
  ["hx_eye", "眼睛疾病（不含可以矯正之近視或遠視）"], ["hx_hear", "聽力損失"], ["hx_limb", "上肢或下肢疾病（如會導致關節僵硬、無力等症狀之疾病）"],
  ["hx_dm", "糖尿病"], ["hx_asthma", "氣喘"]];
const HX_HEART = [["hx_angina", "心絞痛"], ["hx_chd", "冠心病"], ["hx_mi", "心肌梗塞"], ["hx_stent", "接受心導管支架手術"],
  ["hx_cabg", "曾接受冠狀動脈繞道手術"], ["hx_cadmed", "冠狀動脈疾病接受藥物治療"], ["hx_htn", "高血壓"], ["hx_arr", "心律不整"]];
const TENSION = ["經常負責會威脅自己或他人生命、財產的危險性工作", "有迴避危險責任的工作", "關乎人命、或可能左右他人一生重大判決的工作",
  "處理高危險物質的工作", "可能造成社會龐大損失責任的工作", "有過多或過分嚴苛的限時工作", "需在一定的期間內（如交期等）完成的困難工作",
  "負責處理客戶重大衝突或複雜的勞資紛爭", "無法獲得周遭理解或孤立無援狀況下的困難工作", "負責複雜困難的開發業務、或公司重建等工作"];
const WORK_Q = [["q5", "有無工作相關突發異常事件（如近期發生車禍、車子於行駛中發生重大故障等）？"],
  ["q6", "工作環境中有無組織文化、職場正義問題（如職場人際衝突、部門內部溝通管道不足等）？"],
  ["q7", "對預定之工作排程或工作內容經常性變更或無法預估、常屬於事前的通知狀況等？"],
  ["q8", "經常性出差，其具有時差、無法休憩、休息或適當住宿、長距離自行開車或往返兩地而無法恢復疲勞狀況等？"]];
const EXAM = [["e_bmi", "身體質量指數", "kg/m²"], ["e_tc", "總膽固醇", "mg/dL"], ["e_height", "身高", "公分"], ["e_tg", "三酸甘油脂", "mg/dL"],
  ["e_weight", "體重", "公斤"], ["e_ldl", "低密度膽固醇", "mg/dL"], ["e_waist", "腰圍", "公分"], ["e_hdl", "高密度膽固醇", "mg/dL"],
  ["e_pulse", "脈搏", ""], ["e_uprot", "尿蛋白", ""], ["e_sbp", "收縮壓", "mmHg"], ["e_ubld", "尿潛血", ""],
  ["e_dbp", "舒張壓", "mmHg"], ["e_glu", "飯前血糖", "mg/dL"]];
// 畫面上照類別排，成對的放在一起（收縮壓、舒張壓並排）；寬度不夠時兩個一排，成對的還是在同一排
const EXAM_ROWS = [["體位", ["e_height", "e_weight", "e_bmi", "e_waist"]], ["血壓、血糖", ["e_sbp", "e_dbp", "e_pulse", "e_glu"]],
  ["血脂", ["e_tc", "e_tg", "e_ldl", "e_hdl"]], ["尿液", ["e_uprot", "e_ubld"]]];
const MS_CHANGE = [["mc_place", "變更工作場所"], ["mc_job", "轉換工作"], ["mc_night", "減少大夜班次數"], ["mc_day", "轉換為白天的工作"], ["mc_other", "其他"]];

// ---------- 計分 ----------
const CONV = [100, 75, 50, 25, 0];
const ans = (c, k, n) => { const v = parseInt(c[k], 10); return v >= 1 && v <= n ? v : 0; };
// 個人相關（1～6 題）、工作相關（1～7 題，第 7 題反向）過勞分數：全部答完才算；四捨五入到小數一位
function burnout(c) {
  const p = [1, 2, 3, 4, 5, 6].map((i) => ans(c, `cb_p${i}`, 5));
  const w = [1, 2, 3, 4, 5, 6, 7].map((i) => ans(c, `cb_w${i}`, 5));
  const avg = (sum, n) => { const r10 = Math.floor((sum * 20 + n) / (2 * n)); return r10 / 10; };
  let personal = null, pLevel = "", work = null, wLevel = "";
  if (p.every(Boolean)) {
    const s = p.reduce((a, v) => a + CONV[v - 1], 0);
    personal = avg(s, 6);
    pLevel = s < 50 * 6 ? "輕微" : s <= 70 * 6 ? "中度" : "嚴重";
  }
  if (w.every(Boolean)) {
    const s = w.reduce((a, v, i) => a + (i === 6 ? 100 - CONV[v - 1] : CONV[v - 1]), 0);
    work = avg(s, 7);
    wLevel = s < 45 * 7 ? "輕微" : s <= 60 * 7 ? "中度" : "嚴重";
  }
  return { personal, pLevel, work, wLevel };
}
// 心情溫度計：1～5 題總分（全部答完才算）、附加題
function bsrs(c) {
  const v = [1, 2, 3, 4, 5].map((i) => (/^[0-4]$/.test(String(c[`m${i}`] ?? "")) ? +c[`m${i}`] : null));
  const total = v.every((x) => x !== null) ? v.reduce((a, x) => a + x, 0) : null;
  const level = total === null ? "" : total <= 5 ? "良好" : total <= 9 ? "輕度情緒困擾" : total <= 14 ? "中度情緒困擾" : "重度情緒困擾";
  const extra = /^[0-4]$/.test(String(c.m6 ?? "")) ? +c.m6 : null;
  return { total, level, extra };
}
const BSRS_ADVICE = { "良好": "身心適應狀況良好，請繼續維持自己的好心情。",
  "輕度情緒困擾": "建議找家人或朋友談談，抒發情緒；要注意調整一下自己的壓力狀況，試著多放鬆心情。",
  "中度情緒困擾": "建議尋求心理諮商或接受專業諮詢。", "重度情緒困擾": "需高關懷，建議尋求專業輔導或精神科治療。" };
const BURN_TEXT = { "輕微": "輕微", "中度": "中度", "嚴重": "嚴重" };

// 工作班別 → 過勞量表、心情溫度計表頭的班別
function shiftHeader(c) {
  const s = String(c.shift || "");
  if (!s) return ["", ""];
  if (s.includes("輪")) return ["輪班", ""];
  if (!s.includes("夜") && ["白", "日", "正常"].some((w) => s.includes(w))) return ["正常班", ""];
  return ["其他", s];
}

// ---------- 畫面 ----------
// 小工具：data-k＝存檔的欄位名稱
const tx = (k, cls, ph) => `<input type="text" class="f-in ${cls || ""}" data-k="${k}"${ph ? ` placeholder="${esc(ph)}"` : ""} autocomplete="off">`;
const num = (k, cls) => `<input type="text" inputmode="decimal" class="f-in f-num ${cls || ""}" data-k="${k}" autocomplete="off">`;
const ta = (k, rows, ph) => `<textarea class="f-ta" data-k="${k}" rows="${rows || 2}"${ph ? ` placeholder="${esc(ph)}"` : ""}></textarea>`;
const ck = (k, label) => `<label class="f-ck"><input type="checkbox" data-k="${k}"><span>${label}</span></label>`;
let uid = 0;
const rd = (k, opts, labels) => {
  const n = `f${++uid}_${k}`;
  return `<span class="f-rd" role="radiogroup">${opts.map((o, i) => `<label class="f-ck"><input type="radio" name="${n}" data-k="${k}" value="${esc(o)}"><span>${esc(labels ? labels[i] : o)}</span></label>`).join("")}</span>`;
};

function owForm() {
  let h = `<section class="f-form" data-form="ow"><h3>過負荷評估問卷</h3>`;
  h += `<fieldset class="f-sec"><legend>一、基本資料</legend><div class="f-grid">` +
    `<label>姓名 ${tx("b_name")}</label><div>性別 ${rd("b_sex", ["男", "女"])}</div>` +

  h += `<fieldset class="f-sec"><legend>五、生活習慣史</legend>` +

    `<div class="f-line"><b>4. 用餐時間不正常</b> ${rd("meal", ["否", "是"])}；外食頻率 ${rd("eatout", ["無", "一餐", "兩餐", "三餐"])}</div>` +
    `<div class="f-line"><b>5. 自覺睡眠不足</b> ${rd("sleep", ["否", "是"])} 工作日睡眠平均 ${num("sleep_work", "f-s")} 小時/日；假日睡眠平均 ${num("sleep_off", "f-s")} 小時/日</div>` +
    `<div class="f-line"><b>6. 運動習慣</b> ${rd("sport", ["無", "有"])} 每週 ${num("sport_n", "f-s")} 次、每次 ${num("sport_min", "f-s")} 分</div>` +
    `<div class="f-line"><b>7. 其他</b> ${tx("life_other", "f-l")}</div></fieldset>`;
  h += `<fieldset class="f-sec"><legend>六、工作相關因素</legend>` +
    `<div class="f-line"><b>1. 工作時數</b> 平均每天 ${num("w_day", "f-s")} 小時；平均每週 ${num("w_week", "f-s")} 小時；平均每月加班 ${num("w_ot", "f-s")} 小時</div>` +
    `<div class="f-line"><b>2. 工作班別</b> ${rd("shift", ["白班", "夜班", "輪班"])}（${rd("shift_rot", ["定期", "不定期"])}；輪班方式 ${tx("shift_way", "f-m")}）</div>` +
    `<div class="f-line"><b>3. 工作環境（可複選）</b></div><div class="f-sub">${ck("env_noise", "噪音")} ${num("env_noise_db", "f-s")} 分貝　` +
    `${ck("env_temp", "異常溫度")} 高溫約 ${num("env_hot", "f-s")} 度；低溫約 ${num("env_cold", "f-s")} 度<br>` +

const EVAL_KEYS = ["cvd10", "cvd10_src", "wt_jet", "risk", "risk_manual", "note"];
const firstNum = (x) => { const m = /[0-9]+(?:\.[0-9]+)?/.exec(String(x === null || x === undefined ? "" : x).normalize("NFKC")); return m ? parseFloat(m[0]) : null; };
// 依表一～表四判斷過負荷風險（資料不夠就是空字串）
function riskEval(c) {
  const cs = String(c.cvd10 === null || c.cvd10 === undefined ? "" : c.cvd10).normalize("NFKC").trim();
  const v = firstNum(cs);
  let t1 = null, cvd = null;
  if (v !== null) {
    const x = /^</.test(cs) ? v - 0.001 : /^[≧≥>]/.test(cs) ? v + 0.001 : v;     // 「<1%」「≧30%」
    t1 = x < 10 ? 0 : x <= 20 ? 1 : x <= 30 ? 2 : 3;
    cvd = x < 10 ? 0 : x <= 20 ? 1 : 2;
  }
  const b = burnout(c), L = { "輕微": 0, "中度": 1, "嚴重": 2 };
  const p = b.personal === null ? null : L[b.pLevel];
  const w = b.work === null ? null : L[b.wLevel];
  const otv = firstNum(c.w_ot);
  const o = otv === null ? null : otv < 45 ? 0 : otv <= 80 ? 1 : 2;
  const db = firstNum(c.env_noise_db);
  const noiseLow = c.env_noise === true && db !== null && db <= 80;
  const items = [c.q7 === "有", c.q8 === "有", c.env_temp === true, c.env_noise === true && !noiseLow, c.wt_jet === true,
    TENSION.some((_, i) => c[`t${i + 1}`] === true)];
  const answered = !!(c.q7 || c.q8) || Object.keys(c).some((k) => /^(env_(noise|temp|vent|ergo|none)|t\d+|t_none|wt_jet)$/.test(k) && c[k] === true);
  const n = items.filter(Boolean).length;
  const t = answered ? (n <= 1 ? 0 : n <= 3 ? 1 : 2) : null;
  const parts = [p, w, o, t].filter((x) => x !== null);
  const load = parts.length ? Math.max.apply(null, parts) : null;
  const sum = cvd === null || load === null ? null : cvd + load;
  const risk = sum === null ? "" : sum === 0 ? "低" : sum <= 2 ? "中" : "高";
  return { cs, t1, cvd, b, p, w, otv, o, db, noiseLow, items, n, t, load, sum, risk };
}

const EMPLOYEE = ["ow", "cb", "bsrs"];          // 員工自填的三份；面談結果表是醫師另外填

// el：放問卷的元素；content：已填的內容；opts.readonly：只看不能改；opts.head：表頭（姓名、職工編號、單位、填寫日期）
// opts.forms：要畫哪幾份（預設員工自填的三份；醫師面談用 ["iv"]）
function render(el, content, opts) {
  opts = opts || {};
  const head = opts.head || {};
  const list = FORMS.filter(([k]) => (opts.forms || EMPLOYEE).includes(k));
  const employee = list.some(([k]) => k === "ow");
  el.innerHTML = `<div class="f-wrapall${opts.readonly ? " f-ro" : ""}"><div class="f-head">${headHtml(head)}</div>` +
    (opts.readonly || list.length < 2 ? "" : `<nav class="f-tabs">${list.map(([k, t]) => `<a href="#" data-go="${k}">${t}</a>`).join("")}</nav>`) +
    (!opts.readonly && employee ? `<p class="f-req">＊每一題都必須填寫（年資、職稱由人事資料自動帶入，可以空白）。</p>` : "") +
    list.map(([, , f]) => f()).join("") + "</div>";
  el._showMiss = false;
  fill(el, content || {});
  if (opts.readonly) readOnly(el);
  update(el);
  if (!el._fForm) {
    el._fForm = true;
    el.addEventListener("input", () => update(el));
    el.addEventListener("change", (e) => {
      const t = e.target;
      // 勾「以上均無／無」就把同一題的其他選項取消，反過來也一樣
      const groups = [["hx_none", /^hx_/], ["fh_none", /^fh_/], ["env_none", /^env_(noise|temp|vent|ergo)$/], ["t_none", /^t\d+$/]];
      if (t.type === "checkbox" && t.checked) {
        for (const [none, re] of groups) {
          if (t.dataset.k === none) el.querySelectorAll("input[type=checkbox]").forEach((x) => { if (re.test(x.dataset.k) && x.dataset.k !== none) x.checked = false; });

function renderEval(el, content, opts) {

  if (!opts.readonly && content.risk && content.risk_manual !== true && content.risk !== riskEval(content).risk) {
    const m = el.querySelector('[data-k="risk_manual"]');

function nmqMissing(el) {

function kimCells(S) {
  const out = [];

  if (S.mode === "one") { const v = c[S.key]; return v === undefined ? [] : kimCells(S).filter((x) => kimId(x.r, x.i) === String(v)); }

// 一段的分數：沒選是 null；hands → { L, R, max }；ABP 不良工作條件 → [A, B, C]
function kimSecPts(S, c) {
  if (S.mode === "hands") {
    const L = kimPicked(S, c, "L"), R = kimPicked(S, c, "R");
    if (!L.length && !R.length) return null;
    const sum = (a) => a.reduce((s, x) => s + kimNum(x.cell.v), 0);
    return { L: sum(L), R: sum(R), max: Math.max(sum(L), sum(R)) };

  if (S.abcVals) return [0, 1, 2].map((j) => p.reduce((s, x) => s + x.cell.v[j], 0));

    });

<script>

(function () {
"use strict";
const F = window.PRForms, $ = (id) => document.getElementById(id);
const el = $("form");
function draw() {
  F.render(el, {}, { forms: F.EMPLOYEE });
  // 基本資料、健康檢查項目由職護的平台帶入，手機上不填
  el.querySelectorAll("fieldset").forEach((fs) => {
    const l = fs.querySelector(":scope > legend");
    if (l && /^(一、基本資料|二、健康檢查項目)/.test(l.textContent.trim())) fs.remove();
  });
  el.querySelectorAll(".f-head").forEach((x) => x.remove());
  const rq = el.querySelector(".f-req");
  if (rq) rq.textContent = "＊每一題都必須填寫。";
  el.querySelectorAll("input, textarea").forEach((x) => x.setAttribute("autocomplete", "off"));
}
draw();
const S = F.owqr.schema();
const msg = (s) => { $("msg").textContent = s; };
let dirty = false;
el.addEventListener("input", () => { dirty = true; if (el._showMiss) { const m = F.missing(el); F.showMissing(el, m, false); msg(m.length ? `還有 ${m.length} 題沒填（紅框的地方）` : ""); } });
el.addEventListener("change", () => { dirty = true; });
window.addEventListener("beforeunload", (e) => { if (dirty && $("qr").hidden) { e.preventDefault(); e.returnValue = ""; } });
function qrSvg(s) {
  for (const lv of ["M", "L"]) {
    try { const q = window.qrcode(0, lv); q.addData(s); q.make(); return q.createSvgTag({ cellSize: 8, margin: 4, scalable: true }); }
    catch (e) { /* 太長：換低一點的容錯 */ }
  }
  return "";
}
$("go").addEventListener("click", () => {
  const miss = F.missing(el);
  if (miss.length) { F.showMissing(el, miss, true); msg(`還有 ${miss.length} 題沒填（紅框的地方）`); return; }
  msg("");
  const svg = qrSvg(F.owqr.pack(F.collect(el), S));
  if (!svg) { msg("說明文字太長，QR code 放不下：請把說明寫短一點再按一次。"); return; }
  $("qrImg").innerHTML = svg;
  $("qr").hidden = false;
  window.scrollTo(0, 0);
});
$("back").addEventListener("click", () => { $("qr").hidden = true; $("qrImg").innerHTML = ""; });
$("clear").addEventListener("click", () => {
  if (!confirm("確定要清除這份問卷的所有回答嗎？")) return;
  $("qr").hidden = true; $("qrImg").innerHTML = ""; dirty = false; msg(""); draw(); window.scrollTo(0, 0);
});
})();

</script>
</body>
