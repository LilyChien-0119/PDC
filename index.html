const EVAL_KEYS = ["cvd10", "cvd10_src", "wt_jet", "risk", "risk_manual", "note"];
const firstNum = (x) => { const m = /[0-9]+(?:\.[0-9]+)?/.exec(String(x === null || x === undefined ? "" : x).normalize("NFKC")); return m ? parseFloat(m[0]) : null; };
// 依表一～表四判斷過負荷風險（資料不夠就是空字串）
function riskEval(c) {
  const cs = String(c.cvd10 === null || c.cvd10 === undefined ? "" : c.cvd10).normalize("NFKC").trim();
  const v = firstNum(cs);
  let t1 = null, cvd = null;
  if (v !== null) {
    const x = /^</.test(cs) ? v - 0.001 : /^[≧≥>]/.test(cs) ? v + 0.001 : v;     // 「<1%」「≧30%」
    t1 = x < 10 ? 0 : x <= 20 ? 1 : x <= 30 ? 2 : 3;
    cvd = x < 10 ? 0 : x <= 20 ? 1 : 2;
  }
  const b = burnout(c), L = { "輕微": 0, "中度": 1, "嚴重": 2 };
  const p = b.personal === null ? null : L[b.pLevel];
  const w = b.work === null ? null : L[b.wLevel];
  const otv = firstNum(c.w_ot);
  const o = otv === null ? null : otv < 45 ? 0 : otv <= 80 ? 1 : 2;
  const db = firstNum(c.env_noise_db);
  const noiseLow = c.env_noise === true && db !== null && db <= 80;
  const items = [c.q7 === "有", c.q8 === "有", c.env_temp === true, c.env_noise === true && !noiseLow, c.wt_jet === true,
    TENSION.some((_, i) => c[`t${i + 1}`] === true)];
  const answered = !!(c.q7 || c.q8) || Object.keys(c).some((k) => /^(env_(noise|temp|vent|ergo|none)|t\d+|t_none|wt_jet)$/.test(k) && c[k] === true);
  const n = items.filter(Boolean).length;
  const t = answered ? (n <= 1 ? 0 : n <= 3 ? 1 : 2) : null;
  const parts = [p, w, o, t].filter((x) => x !== null);
  const load = parts.length ? Math.max.apply(null, parts) : null;
  const sum = cvd === null || load === null ? null : cvd + load;
  const risk = sum === null ? "" : sum === 0 ? "低" : sum <= 2 ? "中" : "高";
  return { cs, t1, cvd, b, p, w, otv, o, db, noiseLow, items, n, t, load, sum, risk };
}

function render(el, content, opts) {
  opts = opts || {};

    list.map(([, , f]) => f()).join("") + "</div>";
  el._showMiss = false;
  fill(el, content || {});
  if (opts.readonly) readOnly(el);
  update(el);
  if (!el._fForm) {
    el._fForm = true;
    el.addEventListener("input", () => update(el));
    el.addEventListener("change", (e) => {
      const t = e.target;
      // 勾「以上均無／無」就把同一題的其他選項取消，反過來也一樣
      const groups = [["hx_none", /^hx_/], ["fh_none", /^fh_/], ["env_none", /^env_(noise|temp|vent|ergo)$/], ["t_none", /^t\d+$/]];
      if (t.type === "checkbox" && t.checked) {
        for (const [none, re] of groups) {
          if (t.dataset.k === none) el.querySelectorAll("input[type=checkbox]").forEach((x) => { if (re.test(x.dataset.k) && x.dataset.k !== none) x.checked = false; });
          else if (re.test(t.dataset.k)) { const n = el.querySelector(`input[data-k="${none}"]`); if (n) n.checked = false; }

        if (/^hx_(angina|chd|mi|stent|cabg|cadmed|htn|arr|heart_other)$/.test(t.dataset.k)) el.querySelector('input[data-k="hx_heart"]').checked = true;

      if (t.type === "text" && t.value.trim()) {
        const box = { hx_heart_other_t: "hx_heart_other", hx_med_t: "hx_med", hx_other_t: "hx_other", fh_other_t: "fh_other",
          env_noise_db: "env_noise", env_hot: "env_temp", env_cold: "env_temp", ms_ot_h: "ms_ot", ms_other_t: "ms_other",
          ms_h1: "ms_hours", ms_m1: "ms_hours", ms_h2: "ms_hours", ms_m2: "ms_hours" }[t.dataset.k] || (/^mc_\w+_t$/.test(t.dataset.k) ? t.dataset.k.slice(0, -2) : "");

        if (b) b.checked = true;
      }
      update(el);

      const a = e.target.closest("[data-go]");

  CB_W.forEach((_, i) => need(`cb_w${i + 1}`, `過勞量表（二）第 ${i + 1} 題`));
  BSRS.forEach((_, i) => need(`m${i + 1}`, `心情溫度計第 ${i + 1} 題`));

// 沒填的題目標紅框；scroll：捲到第一題
function showMissing(el, list, scroll) {
  el.querySelectorAll(".f-miss").forEach((x) => x.classList.remove("f-miss"));
  let first = null;
  for (const [k, , box] of list) {
    const x = el.querySelector(`[data-k="${k}"]`);
    if (!x) continue;
    const area = box ? x.closest(box) : x.closest(".f-q, tr, .f-grid > label, .f-grid > div, .f-line, .f-sub, p, fieldset");
    if (area) { area.classList.add("f-miss"); first = first || area; }
  }
  el._showMiss = list.length > 0 || el._showMiss;
  if (scroll && first) first.scrollIntoView({ behavior: "smooth", block: "center" });
}
// 醫師面談結果表有沒有填
const ivDone = (c) => !!(c && (c.iv_date || c.iv_doctor || c.iv_fatigue || c.iv_diag || c.iv_work || c.iv_guide));
// 員工自填問卷有沒有填（過勞量表、心情溫度計或生活習慣有答）
const empDone = (c) => !!(c && (c.cb_p1 || c.cb_w1 || c.m1 || c.smoke || c.w_day));

// 只能看：不能改，但勾選要看得清楚（不用 disabled，免得變灰）
function readOnly(el) {
  el.querySelectorAll("input, textarea").forEach((x) => {
    x.removeAttribute("placeholder");
    if (x.type === "checkbox" || x.type === "radio") x.tabIndex = -1; else x.readOnly = true;
  });
}
// ---------- 過負荷評估結果（健康總覽「過負荷評估結果」按鈕）----------
// content：整份電子問卷的內容；opts.readonly：只看；opts.head：表頭
function renderEval(el, content, opts) {
  opts = opts || {};
  content = content || {};
  el.innerHTML = `<div class="f-wrapall${opts.readonly ? " f-ro" : ""}"><div class="f-head">${headHtml(opts.head || {})}</div>${evalForm()}</div>`;
  el._evalBase = content;
  fill(el, content);
  // 以前存的：選的風險跟自動判斷不同 → 當作職護自己改的
  if (!opts.readonly && content.risk && content.risk_manual !== true && content.risk !== riskEval(content).risk) {
    const m = el.querySelector('[data-k="risk_manual"]');
    if (m) m.checked = true;
  }
  if (opts.readonly) readOnly(el);
  evalUpdate(el);
  if (el._fEval) return;
  el._fEval = true;
  // 職護自己點過負荷風險：跟自動判斷不同就記下來（之後不再自動改）
  const touched = (t) => {
    if (!t.dataset || t.dataset.k !== "risk") return;
    const m = el.querySelector('[data-k="risk_manual"]');
    if (m) m.checked = t.value !== riskEval(evalContent(el)).risk;
  };
  el.addEventListener("input", (e) => { touched(e.target); evalUpdate(el); });
  el.addEventListener("change", (e) => { touched(e.target); evalUpdate(el); });
  el.addEventListener("click", (e) => {
    if (!e.target.closest("[data-riskauto]")) return;
    const m = el.querySelector('[data-k="risk_manual"]');
    if (m) m.checked = false;
    evalUpdate(el);
  });
}
// 問卷內容＋畫面上職護改的欄位
function evalContent(el) {
  const c = Object.assign({}, el._evalBase || {});
  for (const k of EVAL_KEYS) delete c[k];
  return Object.assign(c, collect(el));
}
const evalCollect = (el) => collect(el);
function evalUpdate(el) { nurseUpdate(el, evalContent(el)); }
// 存電子問卷時：職護沒有自己改過的話，過負荷風險跟著自動判斷；before＝修改前的內容
function withAutoRisk(c, before) {
  const out = Object.assign({}, c);
  if (before && before.risk && before.risk_manual !== true && before.risk !== riskEval(before).risk) out.risk_manual = true;
  if (out.risk_manual !== true) { const r = riskEval(out).risk; if (r) out.risk = r; else delete out.risk; }
  return out;
}
function headHtml(head) {
  return `<span>姓名：<b>${esc(head.name || "")}</b></span><span>職工編號：<b>${esc(head.id || "")}</b></span>` +
    `<span>單位：<b>${esc(head.dept || "")}</b></span><span>${esc(head.dateLabel || "填寫日期")}：<b>${esc(head.date || "")}</b></span>`;
}
function setHead(el, head) { const h = el.querySelector(".f-head"); if (h) h.innerHTML = headHtml(head); }
function fill(el, c) {
  el.querySelectorAll("[data-k]").forEach((x) => {
    const v = c[x.dataset.k];
    if (x.type === "checkbox") x.checked = v === true;
    else if (x.type === "radio") x.checked = v !== undefined && v !== null && String(v) === x.value;
    else x.value = v === undefined || v === null ? "" : String(v);
  });
  multiFill(el);
}
// 可複選、但存成一串字的題目（例：指導區分「要健康指導、需醫療指導」）：方框是 k_v第幾個（Word 照這個勾），存的字放在隱藏欄位
function multi(k, opts) {
  return `<span class="f-multi" data-multi="${k}">` + opts.map((o, i) =>
    `<label class="f-ck"><input type="checkbox" data-k="${k}_v${i}" data-v="${esc(o)}"><span>${esc(o)}</span></label>`).join("") +
    `<input type="hidden" data-k="${k}"></span>`;
}
function multiSync(el) {           // 方框 → 隱藏欄位
  el.querySelectorAll("[data-multi]").forEach((g) => {
    g.querySelector("input[type=hidden]").value = [...g.querySelectorAll("input[type=checkbox]:checked")].map((x) => x.dataset.v).join("、");
  });
}
function multiFill(el) {           // 隱藏欄位 → 方框（舊的單選紀錄也勾得回來）
  el.querySelectorAll("[data-multi]").forEach((g) => {
    const vals = String(g.querySelector("input[type=hidden]").value || "").split("、").map((x) => x.trim());
    g.querySelectorAll("input[type=checkbox]").forEach((x) => { x.checked = vals.includes(x.dataset.v); });
  });
}
// 畫面 → 內容（沒填的不存）
function collect(el) {
  multiSync(el);
  const c = {};
  el.querySelectorAll("[data-k]").forEach((x) => {
    const k = x.dataset.k;
    if (x.type === "checkbox") { if (x.checked) c[k] = true; }
    else if (x.type === "radio") { if (x.checked) c[k] = x.value; }
    else { const v = x.value.trim(); if (v) c[k] = v; }
  });
  return c;
}
// 分數、班別即時更新
function update(el) {
  const c = collect(el);

  set('[data-score="w"]', b.work === null ? "工作相關過勞分數：答完 7 題會自動計算" : `工作相關過勞分數：<b>${b.work}</b> 分（${b.wLevel}）`);

      `<span class="f-muted">（依過負荷評估問卷的工作班別）</span>`;

}

// 職護評估：表一～表四標出這次的位置、算出建議的過負荷風險
function nurseUpdate(el, c) {
  const box = el.querySelector('[data-form="eval"]');
  if (!box) return;
  const r = riskEval(c);
  const set = (sel, html) => { const x = box.querySelector(sel); if (x) x.innerHTML = html; };
  const hit = (sel, on) => box.querySelectorAll(sel).forEach((x, i) => x.classList.toggle("f-hit", on(i)));
  set("[data-cvdsrc]", c.cvd10_src ? `（${esc(c.cvd10_src)} 健檢報告的數值，可以修改）` : "（健檢報告的「十年心血管風險」，可以修改）");
  hit('[data-ref="t1"] tbody tr', (i) => i === r.t1);
  set('[data-out="t1"]', r.t1 === null ? "沒有十年心血管疾病發病風險，無法判斷" : `十年心血管疾病發病風險 ${esc(r.cs)}：<b>${T1_ROWS[r.t1][1]}</b>`);
  // 表二：每一欄標出這次的等級
  const lv = [r.p, r.w, r.o, r.t];
  box.querySelectorAll('[data-ref="t2"] tbody tr:not(.f-now)').forEach((tr, i) => tr.querySelectorAll("td").forEach((td, j) => td.classList.toggle("f-hit", lv[j] === i)));
  const now = [r.p === null ? "—" : `${r.b.personal} 分`, r.w === null ? "—" : `${r.b.work} 分`, r.o === null ? "—" : `${r.otv} 小時`, r.t === null ? "—" : `${r.n} 項`];
  box.querySelectorAll("[data-now]").forEach((td, j) => { td.textContent = now[j] + (lv[j] === null ? "" : `（${LOAD[lv[j]]}）`); });
  set('[data-out="load"]', r.load === null ? "問卷還沒填過勞量表、加班時數或工作型態，無法判斷工作負荷" : `工作負荷：<b>${LOAD[r.load]}</b>（${r.load}）`);
  // 表三：這次有哪幾項
  box.querySelectorAll("[data-w]").forEach((td) => {
    const i = +td.dataset.w;
    let mk = td.querySelector(".f-mk");
    if (i !== 4) {
      if (!mk) { mk = document.createElement("b"); mk.className = "f-mk"; td.insertBefore(mk, td.firstChild); }
      mk.textContent = r.items[i] ? "有" : (i === 3 && r.noiseLow ? `無（${r.db} 分貝）` : "—");
    }
    td.closest("tr").classList.toggle("f-hit", r.items[i]);
  });
  set('[data-out="t3"]', r.t === null ? "問卷還沒填工作型態相關的題目" : `工作型態具 <b>${r.n}</b> 項：${LOAD[r.t]}`);
  hit('[data-ref="t4"] td[data-cell]', () => false);
  if (r.sum !== null) { const td = box.querySelector(`[data-cell="${r.cvd}-${r.load}"]`); if (td) td.classList.add("f-hit"); }
  set('[data-out="t4"]', r.sum === null ? "十年心血管疾病發病風險、工作負荷都要有，才能判斷風險等級"
    : `心血管 (${r.cvd}) ＋ 工作負荷 (${r.load}) ＝ ${r.sum}：<b>${r.risk}度風險</b>`);
  // 表五、表六
  hit('[data-ref="t5"] td', () => false);
  if (r.sum !== null) { const td = box.querySelector(`[data-t5="${r.load}-${r.cvd}"]`); if (td) td.classList.add("f-hit"); }
  set('[data-out="t5"]', r.sum === null ? "" : `工作負荷${LOAD[r.load].slice(0, 1)}、腦心血管疾病風險${"低中高"[r.cvd]}：<b>${T5[r.load][r.cvd]}</b>`);
  hit('[data-ref="t6"] tbody tr', (i) => i === r.sum);
  // 過負荷風險：職護沒有自己改的話，跟著自動判斷
  const ro = !!el.querySelector(".f-ro");
  const manual = c.risk_manual === true;
  if (!ro && !manual && r.risk) { const x = box.querySelector(`input[data-k="risk"][value="${r.risk}"]`); if (x) x.checked = true; }
  const cur = (box.querySelector('input[data-k="risk"]:checked') || {}).value || "";

    : row("職業促發腦、心血管疾病風險等級", `${T6[r.sum][0]}（${r.sum}）`) + row("面談建議", T5[r.load][r.cvd]) + row("健康管理措施", T6[r.sum][1]) +
      (manual && cur && cur !== r.risk ? row("過負荷風險（職護判定）", esc(cur)) : ""));
}

<script>

(function () {
"use strict";
const F = window.PRForms, K = F.qr.KINDS, $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pad = (n) => String(n).padStart(2, "0");
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const nowHm = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

const EMP = Object.keys(K).filter((k) => K[k].who === "emp"), NURSE = Object.keys(K).filter((k) => K[k].who === "nurse");
const el = $("form");
let kind = "", dirty = false, editing = "";
// ---------- 現場評估的清單（只存在這支手機的瀏覽器）----------
const DKEY = "chc_eval_drafts";
const drafts = () => { try { const a = JSON.parse(localStorage.getItem(DKEY) || "[]"); return Array.isArray(a) ? a.filter((x) => x && K[x.kind]) : []; } catch (e) { return []; } };
const putDrafts = (a) => { try { localStorage.setItem(DKEY, JSON.stringify(a)); return true; } catch (e) { return false; } };
const msg = (s, ok) => { $("msg").textContent = s || ""; $("msg").className = "m-msg" + (ok ? " ok" : ""); };
// ---------- 表單：拿掉平台會帶的欄位 ----------
function trim(k) {
  el.querySelectorAll(".f-head").forEach((x) => x.remove());
  const rm = (key, sel) => { const x = el.querySelector(`[data-k="${key}"]`); const box = x && (sel === "rd" ? (x.closest(".f-rd") || x).parentElement : x.closest(sel)); if (box) box.remove(); };
  if (k === "ow") {
    el.querySelectorAll("fieldset").forEach((fs) => { const l = fs.querySelector(":scope > legend"); if (l && /^(一、基本資料|二、健康檢查項目)/.test(l.textContent.trim())) fs.remove(); });
    const rq = el.querySelector(".f-req"); if (rq) rq.textContent = "＊每一題都必須填寫。";
  }
  if (k === "nmq") el.querySelectorAll("fieldset.nmq-jd").forEach((x) => x.remove());
  if (k === "rpself") {
    rm("ps_date", ".f-line"); rm("ps_sex", "rd"); rm("ps_ht", "label"); rm("ps_wt", "label");
    el.querySelectorAll(".f-muted, .f-note, p, small").forEach((x) => { if (/^性別、身高、體重自動帶/.test(x.textContent.trim())) x.remove(); });
  }
  if (k === "wai") rm("w_date", ".f-line");
  el.querySelectorAll("input, textarea").forEach((x) => x.setAttribute("autocomplete", "off"));
}
function draw(k, c) {
  K[k].render(el, c || {}, {});
  trim(k);
  dirty = false;
}
const missOf = (k) => (K[k].missing(el) || []).filter((m) => !F.qr.schema(k).skip.test(m[0]));
function checkMiss(k) {
  const miss = missOf(k);
  if (miss.length) { K[k].showMissing(el, miss, true); el._qrMiss = true; msg(`還有 ${miss.length} 題沒填（紅框的地方）`); return false; }
  return true;
}
el.addEventListener("input", () => { dirty = true; if (el._qrMiss && kind) { const m = missOf(kind); K[kind].showMissing(el, m, false); msg(m.length ? `還有 ${m.length} 題沒填（紅框的地方）` : ""); } });
el.addEventListener("change", () => { dirty = true; });
window.addEventListener("beforeunload", (e) => { if (dirty && $("qr").hidden) { e.preventDefault(); e.returnValue = ""; } });
// ---------- QR code ----------
function qrSvg(s) {
  for (const lv of ["M", "L"]) {
    try { const q = window.qrcode(0, lv); q.addData(s); q.make(); return q.createSvgTag({ cellSize: 8, margin: 4, scalable: true }); }
    catch (e) { /* 太長：換低一點的容錯 */ }
  }
  return "";
}
function showQr(title, sub, data, btns) {
  const svg = qrSvg(data);
  if (!svg) { msg("說明文字太長，QR code 放不下：請把說明寫短一點再試一次。"); return false; }
  $("qrTitle").textContent = title; $("qrSub").textContent = sub; $("qrImg").innerHTML = svg;
  $("qrBtns").innerHTML = btns.map((b, i) => `<button type="button" class="m-btn${b.danger ? " danger" : ""}" data-i="${i}">${esc(b.t)}</button>`).join("");
  $("qrBtns").onclick = (e) => { const b = e.target.closest("[data-i]"); if (b) btns[+b.dataset.i].f(); };
  $("qr").hidden = false;
  window.scrollTo(0, 0);
  return true;
}
const hideQr = () => { $("qr").hidden = true; $("qrImg").innerHTML = ""; };
// ---------- 畫面 ----------
function page() {
  hideQr(); msg("");
  const k = decodeURIComponent(location.hash.replace(/^#/, ""));
  kind = K[k] ? k : "";
  editing = "";
  const nurse = kind && K[kind].who === "nurse", menu = !kind;
  $("menu").hidden = !(menu || k === "list");
  $("idBar").hidden = !nurse;
  $("doneBar").hidden = !kind;
  $("backLink").hidden = !(nurse || k === "list");
  $("list").hidden = !(nurse || k === "list" || (menu && drafts().length));
  if (k === "list") { $("menu").hidden = true; }
  if (!kind) {
    el.innerHTML = "";
    $("ttl").textContent = k === "list" ? "現場評估清單" : "CHC 手機填寫";
    $("sub").textContent = k === "list" ? "存在這支手機的評估：回到筆電打開那個人的表單，按「掃描手機」，再按這裡的「顯示 QR code」。" : "請選要填的問卷。員工自填的問卷通常是掃職護電腦上的 QR code 直接打開。";
    $("safe").textContent = "這個網頁不會把資料傳到網路。";
    $("safe").className = "m-safe";
    renderMenu(); renderList();
    return;
  }
  const Q = K[kind];
  $("ttl").textContent = Q.name;
  if (Q.who === "emp") {
    $("sub").textContent = `${Q.note ? Q.note + "。" : ""}每一題都要填，填完按最下面的「完成，產生 QR code」，再讓職護用電腦掃描。`;
    $("safe").textContent = "這個網頁不會把你的回答傳到網路，也不會存在手機裡；關掉網頁就清除了。";
    $("safe").className = "m-safe";
    $("go").textContent = "完成，產生 QR code";
  } else {
    $("sub").textContent = "現場評估：填好員工編號、評估項目，按「存到清單」。回到筆電打開那個人的表單按「掃描手機」，再在清單按「顯示 QR code」。";
    $("safe").textContent = "評估結果會暫存在這支手機的瀏覽器（不會傳到網路）；掃進電腦後請在清單刪除。";
    $("safe").className = "m-safe warn";
    $("go").textContent = "存到清單";
    $("pid").value = "";
    $("editNote").textContent = "";
    renderList();
  }
  draw(kind, {});
  window.scrollTo(0, 0);
}
function renderMenu() {
  const n = drafts().length;
  $("menu").innerHTML = `<h2>員工自填問卷</h2><ul>${EMP.map((k) => `<li><a href="#${k}">${esc(K[k].name)}</a></li>`).join("")}</ul>` +
    `<h2>現場評估（職護用）</h2><ul>${NURSE.map((k) => `<li><a href="#${k}">${esc(K[k].name)}</a></li>`).join("")}` +
    `<li><a href="#list">現場評估清單 <small>（${n ? `${n} 份還沒刪` : "沒有"}）</small></a></li></ul>`;
}
function renderList() {
  const a = drafts();
  $("list").innerHTML = `<h2>現場評估清單（存在這支手機）</h2>` + (a.length ? `<ul>${a.map((d) => `<li><b>${esc(d.id || "（沒有員工編號）")}</b>・${esc(K[d.kind].short)}<br><span class="f-muted">${esc(roc(d.date))} ${esc(d.time || "")}</span>` +
    `<div class="m-row"><button type="button" class="m-btn" data-show="${esc(d.uid)}">顯示 QR code</button><button type="button" class="m-btn" data-edit="${esc(d.uid)}">修改</button><button type="button" class="m-btn danger" data-del="${esc(d.uid)}">刪除</button></div></li>`).join("")}</ul>` +
    `<p style="margin-top:10px"><button type="button" class="m-btn danger" id="delAll">全部刪除</button></p>` : `<p class="m-empty">清單是空的。</p>`);
}
$("list").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const a = drafts();
  if (b.id === "delAll") { if (confirm(`確定要刪除清單上全部 ${a.length} 份評估嗎？（還沒掃進電腦的就沒了）`)) { putDrafts([]); renderList(); if (!kind) renderMenu(); } return; }
  const d = a.find((x) => x.uid === (b.dataset.show || b.dataset.edit || b.dataset.del));
  if (!d) return;
  if (b.dataset.del) { if (confirm(`刪除 ${d.id || "（沒有員工編號）"} 的 ${K[d.kind].short}？`)) { putDrafts(a.filter((x) => x !== d)); renderList(); if (!kind) renderMenu(); } return; }
  if (b.dataset.edit) {
    if (dirty && !confirm("目前畫面上的評估還沒存到清單，確定要換成修改這一份嗎？")) return;
    if (location.hash !== `#${d.kind}`) { history.replaceState(null, "", `#${d.kind}`); page(); }
    draw(d.kind, d.c); editing = d.uid; $("pid").value = d.id || "";
    $("editNote").textContent = `修改中：${roc(d.date)} ${d.time || ""} 存的這一份`;
    $("go").textContent = "更新清單";
    window.scrollTo(0, 0);
    return;
  }
  const data = F.qr.pack(d.kind, d.c, { date: d.date, id: d.id });
  showQr(`${d.id || "（沒有員工編號）"}・${K[d.kind].short}`, "在筆電打開這個人的表單，按「掃描手機」，把這個畫面對著鏡頭（亮度調高，距離約 15～25 公分）。",
    data, [{ t: "掃好了，從清單刪除", f: () => { putDrafts(drafts().filter((x) => x.uid !== d.uid)); hideQr(); renderList(); if (!kind) renderMenu(); } },
      { t: "先不要刪，關閉", f: hideQr }]);
});
$("go").addEventListener("click", () => {
  if (!kind || !checkMiss(kind)) return;
  msg("");
  const Q = K[kind], c = F.collect(el);
  if (Q.who === "emp") {
    showQr("請把手機螢幕對著職護的筆電鏡頭", "螢幕亮度調高，距離鏡頭約 15～25 公分，對準後拿穩。",
      F.qr.pack(kind, c, { date: todayIso() }),
      [{ t: "回去修改", f: hideQr }, { t: "清除重填", danger: true, f: () => { if (confirm("確定要清除這份問卷的所有回答嗎？")) { hideQr(); draw(kind, {}); msg(""); window.scrollTo(0, 0); } } }]);
    return;
  }
  const id = $("pid").value.trim();
  if (!id) { msg("請填員工編號（回到筆電掃描時用來核對是誰）"); $("pid").focus(); return; }
  const a = drafts(), old = editing && a.find((x) => x.uid === editing);
  if (old) Object.assign(old, { id, c });
  else a.push({ uid: `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`, kind, id, date: todayIso(), time: nowHm(), c });
  if (!putDrafts(a)) { msg("存不進這支手機（可能是無痕模式）：請改用一般模式打開。"); return; }
  msg(`${old ? "已更新" : "已存到清單"}：${id}・${Q.short}。可以接著評下一位。`, true);
  draw(kind, {}); editing = ""; $("pid").value = ""; $("editNote").textContent = ""; $("go").textContent = "存到清單";
  renderList();
  window.scrollTo(0, 0);
});
window.addEventListener("hashchange", () => { if (dirty && kind && !confirm("這一頁填的還沒完成，確定要離開嗎？")) { history.replaceState(null, "", `#${kind}`); return; } page(); });
page();
})();

</script>
</body>
</html>
